<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROUDY</title>
<meta name="theme-color" content="#050505">
<meta name="description" content="ROUDY — Menos papel, menos distração, mais música.">
<meta name="application-name" content="ROUDY">
<meta name="apple-mobile-web-app-title" content="ROUDY">
<meta property="og:title" content="ROUDY">
<meta property="og:description" content="Menos papel, menos distração, mais música.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/icons/roudy-icon-v4-512.png">
<meta name="sc-api-base-url" content="https://simplificandocifras-production.up.railway.app">
<link rel="manifest" href="manifest.webmanifest?v=14">
<link rel="icon" href="assets/icons/roudy-icon-v4-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="assets/icons/roudy-icon-v4-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/roudy-icon-v4-192.png" sizes="192x192">
<link rel="stylesheet" href="js/editor/song-editor.css">
<link rel="stylesheet" href="js/ai/ai-harmonic-summary.css?v=4">
<link rel="stylesheet" href="js/study-metronome.css?v=3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a1a2e;--bg2:#22223b;--bg3:#2d2d44;
  --accent:#d97757;--accent2:rgba(217,119,87,0.18);
  --text:#ede8e3;--text2:#9b95a3;
  --chord-color:#E8896B;
  --music-accent:#E8896B;
  --border:rgba(255,255,255,0.08);
  --danger:#e05c6a;
}
html,body{width:100%;min-height:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;justify-content:center;min-height:100vh;}
.app{width:100%;max-width:720px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:visible;box-shadow:0 0 32px rgba(0,0,0,.18);}
/* TOPBAR */
.topbar{background:var(--bg2);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.topbar-icon{font-size:22px;}
.topbar-info{flex:1;min-width:0;}
.topbar-title{font-size:17px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:var(--accent);margin-top:1px;}
.export-library-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:7px 9px;font:600 11px/1.2 inherit;cursor:pointer;white-space:nowrap;}
.export-library-btn:hover{background:var(--accent2);}
.library-sync-panel{display:grid;gap:14px;margin:12px 0 16px;padding:16px;border:1px solid var(--border);border-radius:14px;background:rgba(7,17,31,.45)}
.library-sync-counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.library-sync-count{padding:10px;border-radius:10px;background:rgba(255,255,255,.035)}
.library-sync-count span{display:block;color:var(--text2);font-size:11px}.library-sync-count strong{display:block;margin-top:3px;color:var(--text);font-size:20px}
.library-sync-state{display:flex;align-items:flex-start;gap:9px;color:var(--text2);font-size:13px;line-height:1.45}.library-sync-state strong{display:block;color:var(--text);font-size:14px}
.library-sync-state[data-state="synced"]{color:#86efac}.library-sync-state[data-state="conflict"],.library-sync-state[data-state="error"]{color:#fbbf24}
.sync-diagnostic-section{display:grid;gap:8px;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.025)}.sync-diagnostic-section>strong{font-size:13px}.sync-diagnostic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;color:var(--text2);font-size:11px}.sync-diagnostic-grid span{display:flex;justify-content:space-between;gap:8px}.sync-diagnostic-grid b{color:var(--text)}
/* TABS */
.tab-bar{background:var(--bg2);display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;font-weight:500;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* SEARCH */
.search-bar{padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--border);}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;}
.search-input{width:100%;background:var(--bg3);border:none;border-radius:9px;padding:8px 13px 8px 34px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
.search-input::placeholder{color:var(--text2);}
/* LIST */
.content{flex:none;overflow-y:visible;padding-bottom:72px;}
.section-label{padding:7px 15px 3px;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--bg);}
.music-item{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.music-item:hover{background:var(--bg2);}
.music-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.music-info{flex:1;min-width:0;}
.music-title{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.music-sub{font-size:13px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.key-badge{font-size:13px;background:rgba(232,137,107,.14);color:var(--music-accent);padding:4px 10px;border-radius:10px;font-weight:700;flex-shrink:0;}
/* FAB */
.fab{position:fixed;bottom:22px;right:max(16px,calc((100vw - 720px)/2 + 16px));width:54px;height:54px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 4px 16px rgba(217,119,87,.4);transition:transform .15s;font-size:26px;color:#fff;font-weight:300;}
.fab:hover{transform:scale(1.06);}
/* DETAIL VIEW */
.detail-view{display:none;position:fixed;inset:0 auto 0 50%;transform:translateX(-50%);width:100%;max-width:720px;height:100dvh;background:var(--bg);overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;flex-direction:column;z-index:10;box-shadow:0 0 32px rgba(0,0,0,.28);}
.detail-header{background:var(--bg2);padding:13px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.back-btn{color:var(--accent);font-size:24px;cursor:pointer;flex-shrink:0;line-height:1;}
.detail-title-wrap{flex:1;min-width:0;}
.detail-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-artist{font-size:13px;color:var(--text2);margin-top:2px;}
.detail-capo{font-size:12px;color:var(--text2);margin-top:2px;}
.detail-key-badge{font-size:13px;background:rgba(232,137,107,.14);color:var(--music-accent);padding:4px 11px;border-radius:10px;font-weight:700;flex-shrink:0;}
/* TRANSPOSITOR */
.transpose-bar{margin:12px 14px 4px;background:var(--bg3);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.transpose-label{font-size:13px;color:var(--text2);flex:1;}
.transpose-semitone{font-size:12px;color:var(--text2);min-width:24px;text-align:center;}
.t-btn{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-family:inherit;}
.t-btn:hover{background:var(--accent2);color:var(--accent);border-color:var(--accent);}
.transpose-key{font-size:17px;font-weight:700;color:var(--music-accent);min-width:40px;text-align:center;}
.t-reset{font-size:12px;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;font-family:inherit;transition:all .15s;}
.t-reset:hover{border-color:var(--accent);color:var(--accent);}
/* CAPO BANNER */
.capo-banner{margin:10px 14px 0;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;border:2px solid;}
.capo-banner.on{background:rgba(255,200,0,0.12);border-color:rgba(255,200,0,0.5);}
.capo-banner.off{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.1);}
.capo-icon{font-size:24px;flex-shrink:0;}
.capo-info{flex:1;}
.capo-title{font-size:14px;font-weight:700;}
.capo-banner.on .capo-title{color:#ffc800;}
.capo-banner.off .capo-title{color:var(--text2);}
.capo-sub{font-size:12px;margin-top:1px;}
.capo-banner.on .capo-sub{color:rgba(255,200,0,0.7);}
.capo-banner.off .capo-sub{color:var(--text2);}
.capo-toggle{width:42px;height:24px;border-radius:12px;position:relative;transition:background .2s;flex-shrink:0;}
.capo-banner.on .capo-toggle{background:#ffc800;}
.capo-banner.off .capo-toggle{background:var(--bg3);}
.capo-toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;transition:left .2s;}
.capo-banner.on .capo-toggle::after{left:21px;}
.capo-banner.off .capo-toggle::after{left:3px;}
/* SPOTIFY SEARCH */
.spotify-panel{padding:8px 14px 10px;background:var(--bg2);border-bottom:1px solid var(--border)}
.spotify-account-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:11px;color:var(--text2)}
.spotify-account-row span.connected{color:#86efac}
.spotify-auth-btn{border:0;background:transparent;color:#1ed760;font:700 11px inherit;cursor:pointer}
.spotify-search-bar{background:var(--bg3);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);transition:border-color .2s}
.spotify-search-bar:focus-within{border-color:#1ed760}
.spotify-search-input{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.spotify-search-input::placeholder{color:var(--text2)}
.spotify-search-btn,.spotify-add-btn{background:#1db954;border:none;border-radius:8px;color:#07110b;font-size:12px;font-weight:800;padding:7px 12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.spotify-search-btn:disabled{opacity:.5;cursor:not-allowed}
.spotify-results{margin:8px 14px 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg3);overflow:hidden;max-height:310px;overflow-y:auto}
.spotify-results-title,.spotify-message{padding:10px 12px;color:var(--text2);font-size:12px}
.spotify-message.error{color:#fca5a5}.spotify-message.loading{color:#93c5fd}
.spotify-track{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--border)}
.spotify-track-cover{width:42px;height:42px;border-radius:7px;object-fit:cover;flex-shrink:0}.spotify-track-cover.placeholder{display:grid;place-items:center;background:#17231c;color:#1ed760}
.spotify-track-info{flex:1;min-width:0}.spotify-track-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spotify-track-sub{margin-top:3px;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* YOUTUBE SEARCH */
.youtube-panel{padding:8px 14px 10px;background:var(--bg2);border-bottom:1px solid var(--border)}
.youtube-panel-label{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:var(--text2);font-size:11px}.youtube-panel-label strong{color:#ff6b6b}.youtube-brand-mark{display:grid;width:20px;height:14px;place-items:center;border-radius:4px;background:#f00;color:#fff;font-size:8px}
.youtube-search-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg3);transition:border-color .2s}.youtube-search-bar:focus-within{border-color:#ff4e45}
.youtube-search-input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:13px inherit}.youtube-search-input::placeholder{color:var(--text2)}
.youtube-search-btn,.youtube-add-btn{padding:7px 12px;border:0;border-radius:8px;background:#ff3838;color:#fff;font:800 12px inherit;white-space:nowrap;cursor:pointer}.youtube-search-btn:disabled{opacity:.5;cursor:wait}
.youtube-results{max-height:330px;margin:8px 14px 10px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;background:var(--bg3)}
.youtube-results-title,.youtube-message{padding:10px 12px;color:var(--text2);font-size:12px}.youtube-message.error{color:#fca5a5}.youtube-message.loading{color:#93c5fd}
.youtube-video-result{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--border)}.youtube-video-cover{width:72px;aspect-ratio:16/9;flex:0 0 72px;border-radius:7px;object-fit:cover}.youtube-video-info{min-width:0;flex:1}.youtube-video-title{display:-webkit-box;overflow:hidden;font-size:12px;font-weight:700;-webkit-box-orient:vertical;-webkit-line-clamp:2}.youtube-video-channel{margin-top:3px;overflow:hidden;color:var(--text2);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.search-clear{display:grid;width:26px;height:26px;flex:0 0 26px;padding:0;place-items:center;border:0;border-radius:50%;background:transparent;color:#737b88;font-size:15px;line-height:1;cursor:pointer;transition:color .15s,background .15s,opacity .15s}.search-clear:hover,.search-clear:focus-visible{background:rgba(255,255,255,.07);color:#e2e8f0}.search-input:placeholder-shown~.search-clear,.youtube-search-input:placeholder-shown~.search-clear{visibility:hidden;opacity:0;pointer-events:none}.playlist-search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%)}
.pl-sel-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--accent2);transition:opacity .15s;}
.pl-sel-row.dragging{opacity:.4;}
.pl-add-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.pl-add-row:hover{background:var(--bg2);}
/* CAPO SELECTOR */
.capo-opt{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500;transition:all .15s;flex-shrink:0;}
.capo-opt.active{background:var(--music-accent);color:#fff;border-color:var(--music-accent);}
/* INSTRUMENT TABS (compacto) */
.inst-tab{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;}
.inst-tab.active{background:var(--accent2);border-color:rgba(217,119,87,0.4);}
/* CHORD STRIP */
.chord-strip-wrap{display:flex;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:12px 16px 15px;scroll-padding-inline:16px;gap:10px;background:var(--bg2);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--accent) var(--bg3);}
.chord-strip-wrap::-webkit-scrollbar{height:6px;}
.chord-strip-wrap::-webkit-scrollbar-track{background:var(--bg3);border-radius:6px;}
.chord-strip-wrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:6px;}
.chord-card{display:flex;flex:0 0 auto;min-width:95px;max-width:none;min-height:114px;padding:7px 8px;text-align:center;align-items:center;justify-content:flex-start;flex-direction:column;border:1px solid var(--border);border-radius:10px;background:var(--bg);scroll-snap-align:start;}
.chord-card-name{width:100%;min-height:15px;margin-bottom:3px;color:var(--chord-color);font:700 11px/1.2 Arial,sans-serif;white-space:nowrap;overflow:visible;text-align:center;}
.chord-tuning{display:none;max-width:156px;margin-top:4px;color:var(--music-accent);font:600 7.5px/1.3 Inter,Arial,sans-serif;text-align:center;}
.keyboard-card{min-width:181px;}
.chord-card svg{display:block;flex:none;max-width:none;}
.chord-card-unavailable{min-width:144px;justify-content:center;}
.chord-unavailable-message{max-width:120px;color:var(--text2);font-size:11px;line-height:1.35;}
/* CHORD BLOCKS - estilo WhatsApp com blocos */
.detail-body{padding:16px 20px;}
.wa-block{background:var(--bg3);border-radius:10px;border:1px solid var(--border);padding:14px 16px;margin-bottom:14px;}
.chord-line{font-family:Arial,sans-serif;font-size:19.8px;color:var(--chord-color);letter-spacing:.5px;line-height:1.8;font-weight:600;}
.letra-linha{font-family:Arial,sans-serif;font-size:18px;font-weight:700;color:#ffffff;margin:4px 0 0;}
/* MODO PALCO */
.stage-mode .detail-header .back-btn,
.stage-mode #capo-banner,
.stage-mode .stage-hide{display:none!important;}
.stage-mode #chord-diagrams-section,
.stage-mode #inst-modal,
.stage-mode #spotify-song-player,.stage-mode #youtube-song-player{display:none!important;}
.stage-mode .chord-block{background:transparent;border:none;margin-bottom:8px;}
.stage-mode .chord-block summary{font-size:20px;padding:6px 0;}
.stage-mode .chord-line{font-size:var(--stage-chord-size,28px);line-height:2.2;}
.stage-mode .detail-body{padding:12px clamp(10px,3vw,28px);}
/* TOOLBAR PALCO */
.stage-toolbar{display:flex;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;}
.stage-toolbar[hidden]{display:none!important;}
.stage-btn[hidden]{display:none!important;}
.stage-only-control{display:none!important;}
.stage-mode .stage-only-control{display:flex!important;}
.stage-btn:disabled{opacity:.38;cursor:not-allowed;}
.stage-btn{flex:1;padding:8px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
.stage-btn-palco{background:rgba(217,119,87,.15);color:var(--accent);border:1.5px solid var(--accent);}
.stage-btn-palco.active{background:var(--accent);color:#fff;}
.stage-btn-scroll{background:rgba(100,200,100,.12);color:#6dc46d;border:1.5px solid #6dc46d;}
.stage-btn-scroll.active{background:#6dc46d;color:#fff;}
/* MEDLEY */
.medley-block{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1.5px solid rgba(217,119,87,0.3);}
.medley-block-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.medley-source{font-size:12px;color:var(--accent);font-weight:700;flex:1;}
.medley-order-btns{display:flex;gap:4px;}
.medley-order-btn{width:28px;height:28px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.medley-remove{width:28px;height:28px;border-radius:6px;background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* BUTTONS */
.btn{width:100%;padding:11px;border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:9px;font-family:inherit;transition:opacity .15s;}
.btn-primary{background:var(--accent);}
.btn-primary:hover{opacity:.88;}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);margin-top:8px;}
.btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);margin-top:7px;}
.btn-row{display:flex;gap:8px;margin-top:12px;}
.btn-row .btn{margin:0;flex:1;padding:9px;font-size:13px;}
/* SETLISTS */
.setlist-item{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.setlist-item:hover{background:var(--bg2);}
.sl-avatar{width:40px;height:40px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sl-info{flex:1;min-width:0;}
.sl-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl-sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl-count{font-size:11px;background:var(--bg3);color:var(--text2);padding:3px 8px;border-radius:10px;flex-shrink:0;}
/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:30;display:none;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:620px;padding:18px 16px 24px;max-height:92dvh;overflow-x:hidden;overflow-y:auto;}
.modal-handle{width:34px;height:3px;background:var(--bg3);border-radius:2px;margin:0 auto 16px;}

<script>
// ── TRANSPOSIÇÃO ──────────────────────────────────────────────────────
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ALL_CHORDS = ['C#m','Dbm','D#m','Ebm','F#m','Gbm','G#m','Abm','A#m','Bbm',
                    'C#','Db','D#','Eb','F#','Gb','G#','Ab','A#','Bb',
                    'Cm','Dm','Em','Fm','Gm','Am','Bm','C','D','E','F','G','A','B'];

function noteIdx(n){let i=SHARP.indexOf(n);return i===-1?FLAT.indexOf(n):i;}
function shiftNote(n,s){
  const i=noteIdx(n); if(i===-1) return n;
  const ni=((i+s)%12+12)%12;
  return FLAT.includes(n)?FLAT[ni]:SHARP[ni];
}
function shiftToken(tok,s){
  for(const cn of ALL_CHORDS){
    if(tok.startsWith(cn)){
      const suf=tok.slice(cn.length);
      const isMinor=cn.length>1&&cn.endsWith('m');
      const root=isMinor?cn.slice(0,-1):cn;
      const newRoot=shiftNote(root,s);
      if(suf.startsWith('/')){return newRoot+(isMinor?'m':'')+'/'+shiftNote(suf.slice(1),s);}
      return newRoot+(isMinor?'m':'')+suf;
    }
  }
  return tok;
}
function shiftText(text,s){
  if(!s) return text;
  return text.split('\n').map(line=>
    line.replace(/[A-G][#b]?[a-z0-9#()\/]*/g,tok=>{
      for(const cn of ALL_CHORDS){if(tok.startsWith(cn)) return shiftToken(tok,s);}
      return tok;
    })
  ).join('\n');
}

// ── SAVE / LOAD ───────────────────────────────────────────────────────
function salvar(){
  const musicasSalvas=songRepository.save(musicas);

  if(musicasSalvas)librarySync.schedule();
  showToast(musicasSalvas&&setlistsSalvas?'💾 Salvo!':'⚠️ Erro ao salvar');
}
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2e2a3d;color:#ede8e3;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;border:1px solid rgba(217,119,87,0.3);opacity:0;transition:opacity .3s;pointer-events:none;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',1800);
}

function getChordData(name){
  return multiInstrumentChordLibrary.resolve(currentInstrument,name)?.diagram||null;
}

const CHORD_DIAGRAM_SCALE=.65;
function scaledDiagramSize(value){return Math.round(value*CHORD_DIAGRAM_SCALE);}

function drawChordSVG(data, name, strings=6){
  const {f:frets,fi:fingers=[],b:baseFret=1,bar}=data;
  const maxFret=Math.max(...frets.filter(fret=>fret>0),baseFret);
  const S=strings,FRETS=Math.max(4,maxFret-baseFret+1);
  const SW=strings===4?15:12, FH=14;
  const PADL=strings>4?(baseFret>1?16:10):8, PADR=8;
  const NAME_H=0, MARK_H=14, NUT_H=3, GRID_H=FRETS*FH, PADB=8;
  const gridW=(S-1)*SW;
  const W=PADL+gridW+PADR, H=NAME_H+MARK_H+NUT_H+GRID_H+PADB;
  const gridX=PADL, gridY=NAME_H+MARK_H+NUT_H;
  let g='';
  g+=`<rect width="${W}" height="${H}" rx="8" fill="#1a1a2e"/>`;
  if(baseFret>1) g+=`<text x="${gridX-3}" y="${gridY+FH*0.7}" fill="#aaa" font-size="9" text-anchor="end" font-family="Arial">${baseFret}</text>`;
  if(baseFret===1) g+=`<rect x="${gridX}" y="${NAME_H+MARK_H}" width="${gridW}" height="${NUT_H}" fill="#e9edef" rx="1.5"/>`;
  for(let f=1;f<=FRETS;f++) g+=`<line x1="${gridX}" y1="${gridY+f*FH}" x2="${gridX+gridW}" y2="${gridY+f*FH}" stroke="#2a2a4a" stroke-width="1"/>`;
  for(let s=0;s<S;s++) g+=`<line x1="${gridX+s*SW}" y1="${gridY}" x2="${gridX+s*SW}" y2="${gridY+GRID_H}" stroke="#3a3a5a" stroke-width="1"/>`;
  if(bar){const by=gridY+(bar.fr-baseFret)*FH+FH/2,bx1=gridX+bar.s*SW,bx2=gridX+bar.e*SW;g+=`<rect x="${bx1}" y="${by-6}" width="${bx2-bx1}" height="12" rx="6" fill="#d97757" opacity="0.9"/>`;}
  const mY=NAME_H+MARK_H/2+2;
  frets.forEach((fr,si)=>{
    const x=gridX+si*SW;
    if(fr<0){
      g+=`<text x="${x}" y="${mY+4}" fill="#555" font-size="11" text-anchor="middle" font-family="Arial">×</text>`;
    } else if(fr===0){
      g+=`<circle cx="${x}" cy="${mY}" r="4" fill="none" stroke="#8a8a9a" stroke-width="1.5"/>`;
    } else {
      const fy=gridY+(fr-baseFret)*FH+FH/2;
      g+=`<circle cx="${x}" cy="${fy}" r="6.5" fill="#d97757"/>`;
      if(fingers[si]>0) g+=`<text x="${x}" y="${fy+3.5}" fill="#fff" font-size="8.5" text-anchor="middle" font-family="Arial" font-weight="bold">${fingers[si]}</text>`;
    }
  });
  return `<div class="chord-card"><div class="chord-card-name">${eventEsc(name)}</div><svg width="${scaledDiagramSize(W)}" height="${scaledDiagramSize(H)}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg></div>`;
}


function drawPianoSVG(noteString, name){
  const WKW=22, WKH=65, BKW=13, BKH=40;
  const totalW=7*WKW+2;
  const nm={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  const raw=(noteString||'').split(' - ').map(n=>n.trim());
  const notes=new Set(raw.map(n=>nm[n]||n));
  const whites=['C','D','E','F','G','A','B'];
  const blacks=[{n:'C#',p:0.67},{n:'D#',p:1.67},{n:'F#',p:3.67},{n:'G#',p:4.67},{n:'A#',p:5.67}];
  let g='';
  // white keys
  whites.forEach((note,i)=>{
    const on=notes.has(note);
    g+=`<rect x="${1+i*WKW}" y="0" width="${WKW-1.5}" height="${WKH}" rx="3" fill="${on?'#d97757':'#e9edef'}" stroke="#3a4042" stroke-width="1"/>`;
    g+=`<text x="${1+i*WKW+WKW/2}" y="${WKH-4}" fill="${on?'#fff':'#999'}" font-size="8" text-anchor="middle" font-family="Arial" font-weight="${on?'bold':'normal'}">${note}</text>`;
    if(on) g+=`<circle cx="${1+i*WKW+WKW/2}" cy="${WKH-16}" r="8" fill="rgba(0,0,0,0.2)"/>`;
  });
  // black keys
  blacks.forEach(({n,p})=>{
    const on=notes.has(n);
    const x=1+p*WKW-BKW/2;
    g+=`<rect x="${x}" y="0" width="${BKW}" height="${BKH}" rx="2" fill="${on?'#d97757':'#2a2a2a'}" stroke="${on?'#b05030':'#111'}" stroke-width="0.5"/>`;
    if(on) g+=`<text x="${x+BKW/2}" y="${BKH-4}" fill="#fff" font-size="7" text-anchor="middle" font-family="Arial" font-weight="bold">${n.replace('#','#')}</text>`;
  });
  return `<div class="chord-card" style="min-width:${scaledDiagramSize(totalW+22)}px;">
    <div class="chord-card-name">${eventEsc(name)}</div>
    <svg width="${scaledDiagramSize(totalW)}" height="${scaledDiagramSize(WKH+2)}" viewBox="0 0 ${totalW} ${WKH+2}" xmlns="http://www.w3.org/2000/svg">${g}</svg>
    <div style="color:#8696a0;font-size:7.5px;margin-top:2px;font-family:Arial;">${raw.join(' · ')}</div>
  </div>`;
}

function drawValidatedFrettedSVG(data,name){
  const frets=data.frets, fingers=data.fingers||[], courses=data.courses;
  const baseFret=data.baseFret||1, shownFrets=5, spacing=courses>=6?18:22, fretHeight=20;
  const padLeft=baseFret>1?24:15, padRight=15, markerHeight=22;
  const gridWidth=(courses-1)*spacing, gridTop=markerHeight+5, gridHeight=shownFrets*fretHeight;
  const width=padLeft+gridWidth+padRight, height=gridTop+gridHeight+26;
  let svg=`<rect width="${width}" height="${height}" rx="10" fill="#050b14"/>`;
  if(baseFret===1) svg+=`<rect x="${padLeft}" y="${gridTop-3}" width="${gridWidth}" height="4" rx="2" fill="#f8fafc"/>`;
  else svg+=`<text x="${padLeft-5}" y="${gridTop+14}" fill="#cbd5e1" font-size="11" text-anchor="end" font-family="Inter,Arial">${baseFret}ª</text>`;
  for(let fret=0;fret<=shownFrets;fret++) svg+=`<line x1="${padLeft}" y1="${gridTop+fret*fretHeight}" x2="${padLeft+gridWidth}" y2="${gridTop+fret*fretHeight}" stroke="#94a3b8" stroke-width="1.6"/>`;
  for(let course=0;course<courses;course++) svg+=`<line x1="${padLeft+course*spacing}" y1="${gridTop}" x2="${padLeft+course*spacing}" y2="${gridTop+gridHeight}" stroke="#cbd5e1" stroke-width="1.7"/>`;
  for(const barre of data.barres||[]){
    const y=gridTop+(barre.fret-baseFret)*fretHeight+fretHeight/2;
    const x1=padLeft+barre.start*spacing, x2=padLeft+barre.end*spacing;
    svg+=`<rect x="${x1-7}" y="${y-8}" width="${x2-x1+14}" height="16" rx="8" fill="var(--music-accent)"/>`;
    svg+=`<text x="${(x1+x2)/2}" y="${y+4}" fill="#fff" font-size="11" text-anchor="middle" font-family="Inter,Arial" font-weight="800">${barre.finger}</text>`;
  }
  frets.forEach((fret,index)=>{
    const x=padLeft+index*spacing;
    if(fret<0) svg+=`<text x="${x}" y="17" fill="#fff" font-size="16" text-anchor="middle" font-family="Inter,Arial">×</text>`;
    else if(fret===0) svg+=`<circle cx="${x}" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2"/>`;
    else {
      const y=gridTop+(fret-baseFret)*fretHeight+fretHeight/2;
      const coveredByBarre=(data.barres||[]).some(barre=>barre.finger===fingers[index]&&barre.fret===fret&&index>=barre.start&&index<=barre.end);
      if(coveredByBarre) return;
      svg+=`<circle cx="${x}" cy="${y}" r="8" fill="var(--music-accent)"/>`;
      if(fingers[index]) svg+=`<text x="${x}" y="${y+4}" fill="#fff" font-size="11" text-anchor="middle" font-family="Inter,Arial" font-weight="800">${fingers[index]}</text>`;
    }
  });
  const courseLabel=data.renderer==='double-course-fretted'?'5 ordens duplas':`${courses} cordas`;
  return `<div class="chord-card" data-instrument="${data.instrumentId}" data-renderer="${data.renderer}" data-courses="${courses}"><div class="chord-card-name">${eventEsc(name)}</div><svg width="${scaledDiagramSize(width)}" height="${scaledDiagramSize(height)}" viewBox="0 0 ${width} ${height}" aria-label="Diagrama ${eventEsc(name)} para ${eventEsc(data.instrumentId)}">${svg}</svg><div class="chord-tuning">${courseLabel} · ${data.tuning}</div></div>`;
}

function drawValidatedKeyboardSVG(data,name){
  const whiteNotes=['C','D','E','F','G','A','B'];
  const blackNotes=[{note:'C#',left:26},{note:'D#',left:62},{note:'F#',left:134},{note:'G#',left:170},{note:'A#',left:206}];
  const active=new Set(data.notes), root=data.root, bass=data.bass;
  const keyColor=(note)=>note===bass&&bass!==root?'#22C55E':note===root?'var(--music-accent)':'#F2A48B';
  let svg='<rect width="252" height="116" rx="10" fill="#050b14"/>';
  whiteNotes.forEach((note,index)=>{
    const on=active.has(note), x=4+index*35;
    svg+=`<rect x="${x}" y="5" width="34" height="96" rx="3" fill="${on?keyColor(note):'#f8fafc'}" stroke="#334155" stroke-width="1.5"/>`;
    svg+=`<text x="${x+17}" y="94" fill="${on?'#fff':'#475569'}" font-size="11" text-anchor="middle" font-family="Inter,Arial" font-weight="700">${note}</text>`;
  });
  blackNotes.forEach(({note,left})=>{
    const on=active.has(note);
    svg+=`<rect x="${left}" y="5" width="22" height="61" rx="3" fill="${on?keyColor(note):'#111827'}" stroke="#020617" stroke-width="1.5"/>`;
    if(on) svg+=`<text x="${left+11}" y="57" fill="#fff" font-size="9" text-anchor="middle" font-family="Inter,Arial" font-weight="800">${note}</text>`;
  });
  return `<div class="chord-card keyboard-card" data-instrument="${data.instrumentId}" data-renderer="keyboard"><div class="chord-card-name">${eventEsc(name)}</div><svg width="${scaledDiagramSize(252)}" height="${scaledDiagramSize(116)}" viewBox="0 0 252 116" aria-label="Teclas do acorde ${eventEsc(name)}">${svg}</svg><div class="chord-tuning">${data.notes.join(' · ')}${bass!==root?` · baixo ${bass}`:''}</div></div>`;
}

function extractChords(m){
  const summary=songFormat.harmonicSummary(m),seen=new Set(),result=[];
  summary.sections.forEach(section=>section.lines.forEach(line=>line.chords.forEach(item=>{
    const chord=chordUtils.normalizeChordName(item.chord);
    if(chord&&!seen.has(chord)){seen.add(chord);result.push(chord);}
  })));
  return result;
}

const missingDiagramRegistry=new Map();
function registerMissingDiagram(name){
  const key=currentInstrument+':'+name;
  if(missingDiagramRegistry.has(key)) return;
  missingDiagramRegistry.set(key,{instrumento:currentInstrument,acorde:name});
  console.info('[Diagramas] Diagrama não disponível:',currentInstrument,name);
}
function getMissingDiagramReport(){return [...missingDiagramRegistry.values()];}
function renderUnavailableChord(name){
  registerMissingDiagram(name);
  return `<div class="chord-card chord-card-unavailable"><div class="chord-card-name">${eventEsc(name)}</div><div class="chord-unavailable-message">Diagrama não disponível</div></div>`;
}

function renderChordStrip(m){
  const el=document.getElementById('chord-strip');
  if(!el) return;
  const totalShift=currentSemitones+storedCapo-selectedCapo;
  const rawChords=extractChords(m);
  const chords=[...new Set(rawChords.map(c=>shiftText(c,totalShift)))];
  if(!chords.length){el.innerHTML='';return;}
  const html=chords.map(name=>{
    const data=getChordData(name);
    if(!data) return renderUnavailableChord(name);
    return data.renderer==='keyboard'?drawValidatedKeyboardSVG(data,name):drawValidatedFrettedSVG(data,name);
  }).join('');
  el.innerHTML=`<div class="chord-strip-wrap">${html}</div>`;
}

let selectedCapo=0, storedCapo=0;

function transpose(delta){
  currentSemitones=Math.max(-11,Math.min(11,currentSemitones+delta));
  renderDetail();
  const m=currentDetailSongOverride||musicas.find(x=>x.id===currentDetailId);
  if(m) renderChordStrip(m);
}
function resetTranspose(){
  currentSemitones=0;

  if(m) renderChordStrip(m);
}

// detecta se uma linha é de acordes ou letra
function isChordLine(linha){
  return songFormat.chordLine(linha);
}

function renderMusicalText(text,totalShift,full=false){
  return String(text||'').split('\n').map(line=>{
    const chord=isChordLine(line);
    const css=full?`full-chord-line${chord?' is-chord':''}`:chord?'chord-line':'letra-linha';
    return `<div class="${css}">${eventEsc(chord?shiftText(line,totalShift):line)}</div>`;
  }).join('');
}

function bold(txt){
  return (txt||'').replace(/\*(.*?)\*/g,'<strong style="font-family:Arial,sans-serif;color:#ffffff;font-size:16.2px;font-weight:700;">$1</strong>');
}

function renderLinha(linha, totalShift){
  const t = linha.trim();
  if(!t) return '';
  return renderMusicalText(t.startsWith('*')&&t.endsWith('*')?t.slice(1,-1):t,totalShift);
}

function renderFullChordSheet(sheet,totalShift){
  if(!sheet?.content) return '';
  if(Array.isArray(sheet.sections)&&sheet.sections.some(section=>Array.isArray(section.linhas)&&section.linhas.length)){
    const structured=sheet.sections.map(section=>{
      const heading=section.nome?(isChordLine(section.nome)?renderMusicalText(section.nome,totalShift,true):`<div class="full-chord-line is-section">${eventEsc(section.nome)}</div>`):'';
      const lines=(section.linhas||[]).map(line=>{
        const ordered=[...(line.acordes||[])].sort((a,b)=>a.posicao-b.posicao);
        let chordLine='';
        ordered.forEach(item=>{
          const chord=shiftText(item.acorde,totalShift);
          const position=Math.max(chordLine.length,Number(item.posicao)||0);
          chordLine+=' '.repeat(position-chordLine.length)+chord;
        });
        const chords=chordLine?`<div class="full-chord-line is-chord">${eventEsc(chordLine)}</div>`:'';
        const lyric=line.letra?renderMusicalText(line.letra,totalShift,true):'';
        return chords+lyric;
      }).join('');
      return heading+lines;
    }).join('');
    return `<div class="full-chord-private">Privada · conteúdo fornecido por você</div><article class="full-chord-sheet">${structured}</article>`;
  }
  const rows=sheet.content.replace(/\r\n?/g,'\n').split('\n').map(raw=>{
    const text=raw.trimEnd();
    if(!text) return '<div class="full-chord-line">&nbsp;</div>';
    if(isChordLine(text)) return `<div class="full-chord-line is-chord">${eventEsc(shiftText(text,totalShift))}</div>`;
    const section=/^\s*(?:\[.*\]|intro|introdução|verso(?:\s+\d+)?|pré-refrão|refrão|ponte|solo|interlúdio|final|outro)\s*:?\s*$/i.test(text);
    return `<div class="full-chord-line${section?' is-section':''}">${eventEsc(text)}</div>`;
  }).join('');
  return `<div class="full-chord-private">Privada · conteúdo fornecido por você</div><article class="full-chord-sheet">${rows}</article>`;
}

function setSongView(view){

function renderStageStructure(summary,totalShift){
  const sections=(summary&&summary.sections)||[];
  if(!sections.length)return '<div class="empty-state"><div class="emoji">🎼</div><p>Estrutura ainda não cadastrada</p></div>';
  return `<section class="stage-structure-view" aria-label="Estrutura da música">${sections.map((section,index)=>{
    const progression=section.lines.map(line=>songFormat.renderChordLine(line.chords||[])).filter(Boolean).join(' · ');
    return `<article class="stage-structure-card"><strong>${eventEsc(section.label||`Parte ${index+1}`)}</strong><span>${eventEsc(shiftText(progression,totalShift)||'—')}</span></article>`;
  }).join('')}</section>`;
}

function renderDetail(){
  const m=currentDetailSongOverride||musicas.find(x=>x.id===currentDetailId); if(!m) return;
  updateScrollSpeedControls();
  document.getElementById('stage-capo-value').textContent=selectedCapo?String(selectedCapo):'Sem';
  document.getElementById('detail-capo-value').textContent=selectedCapo?String(selectedCapo):'Sem';
  document.getElementById('stage-capo-minus').disabled=selectedCapo===0;
  document.getElementById('stage-capo-plus').disabled=selectedCapo===12;
  const summary=songFormat.harmonicSummary(m);
  // tom que SONA = tom original + transpose
  const soundingKey=shiftText(summary.currentKey, currentSemitones);
  // tom das formas tocadas = sounding - capo selecionado
  const shapeKey=shiftText(soundingKey, -selectedCapo);
  // display do badge igual Cifra Club: "Tom: A (forma de G)"
  if(selectedCapo>0){
    document.getElementById('detail-key').textContent=`${soundingKey} (forma de ${shapeKey})`;
  } else {
    document.getElementById('detail-key').textContent='Tom: '+soundingKey;
  }
  document.getElementById('transposed-key').textContent=soundingKey;
  const sl=document.getElementById('semitone-label');
  sl.textContent=(currentSemitones>=0?'+':'')+currentSemitones;
  sl.style.color=currentSemitones===0?'var(--text2)':currentSemitones>0?'var(--accent)':'#e2954b';
  // shapes exibidos: storedCapo - selectedCapo + transpose
  const totalShift=currentSemitones+storedCapo-selectedCapo;
  const hasFull=Boolean(m.fullChordSheet?.content);
  if(!hasFull) currentSongView='summary';
  const switchHtml=hasFull?`<div class="song-view-switch" role="tablist" aria-label="Visualização da música"><button type="button" role="tab" aria-selected="${currentSongView==='full'}" class="${currentSongView==='full'?'active':''}" onclick="setSongView('full')">Letra + Cifras</button><button type="button" role="tab" aria-selected="${currentSongView==='summary'}" class="${currentSongView==='summary'?'active':''}" onclick="setSongView('summary')">Resumo Harmônico</button></div>`:'';
  const blocosHtml = summary.sections.map(section=>{
    const corpo=section.lines.map(line=>{
      const chords=line.chords.length?songFormat.renderChordLine(line.chords):'';
      const repeat=line.repeticoes?` (${line.repeticoes}x)`:'';
      const chordHtml=chords?`<div class="chord-line">${eventEsc(shiftText(chords,totalShift))}${repeat}</div>`:'';
      const lyricText=line.lyrics.startsWith('*')&&line.lyrics.endsWith('*')?line.lyrics.slice(1,-1):line.lyrics;
      const lyricHtml=lyricText?renderMusicalText(lyricText,totalShift):'';
      return lyricHtml+chordHtml;
    }).join('');
    const labelHtml=section.showLabel&&section.label?renderMusicalText(section.label,totalShift):'';
    return corpo||labelHtml?`<div class="wa-block">${corpo}${labelHtml}</div>`:'';
  }).join('');
  const chordSheetHtml=stageMode&&activeStagePreferences?.contentMode==='structure'
    ?renderStageStructure(summary,totalShift)
    :currentSongView==='full'?renderFullChordSheet(m.fullChordSheet,totalShift):(blocosHtml||`<div class="empty-state"><div class="emoji">🎼</div><p>Cifra ainda não cadastrada</p><button class="btn btn-primary" style="margin-top:14px;" onclick="editMusica(${attrJs(m.id)})">Adicionar cifra</button></div>`);
  document.getElementById('detail-content').innerHTML = switchHtml+chordSheetHtml +
    `<button class="ai-generate-action" style="width:calc(100% - 24px);margin:12px" onclick="generateAiForSong(${attrJs(m.id)})"><span aria-hidden="true">🤖</span> Gerar Letra/Cifra com IA</button>`+
    `<div class="btn-row">
      <button class="btn btn-outline" onclick="editMusica(${attrJs(m.id)})"><span aria-hidden="true">✏️</span> Editar Cifra</button>
      <button class="btn btn-danger" onclick="deleteMusica(${attrJs(m.id)})">🗑️ Excluir</button>
    </div>`;
  if(stageMode)updateStagePresentation();
}

function openDetailFromPlaylist(playlistId,index){
  const playlist=setlists.find(item=>String(item.id)===String(playlistId));
  if(!playlist) return;
  const availableItems=playlist.repertoire.filter(item=>musicas.some(song=>String(song.id)===String(item.songId)));
  const orderedIds=availableItems.map(item=>item.songId),item=availableItems[index];
  const songId=item&&item.songId;
  if(songId===undefined) return;
  openDetail(songId,{playlistContext:{playlistId:playlist.id,songIds:orderedIds,currentIndex:index},songOverride:eventSongVariant(playlist,item,appCurrentUser.id)});
}
function openStageFromEvent(eventId){

  openDetailFromPlaylist(event.id,0);enterStageMode();

const AUTO_SCROLL_MILLISECONDS_PER_SECOND=1000;

function stageContextData(){
  const context=navigationContext.get(),event=context&&findEvent(context.playlistId);
  if(!context)return {context:null,event:null,songs:[currentDetailSongOverride||musicas.find(song=>String(song.id)===String(currentDetailId))].filter(Boolean),contextId:`song:${currentDetailId}`};
  const songs=context.songIds.map((songId,index)=>{

    return event&&item?eventSongVariant(event,item,appCurrentUser.id):musicas.find(song=>String(song.id)===String(songId));

  if(view.classList.contains('stage-mode'))view.style.setProperty('--stage-header-height',Math.ceil(document.getElementById('stage-performance-header').getBoundingClientRect().height)+'px');

new ResizeObserver(measureStageHeader).observe(document.getElementById('stage-performance-header'));
async function enterStageMode(){
  const vd=document.getElementById('view-detail');if(!vd)return;
  if(stageMode)return;
  studyMetronome.stop();
  activeStagePreferences=stagePreferences.normalize({...stagePreferences.load(appCurrentUser.id),contentMode:'lyrics-chords',theme:'dark',controlsMode:'always',autoScroll:false,fullscreen:false,showPrevious:true,showNext:true,showPosition:true,showSetlist:true,showNextPreview:true,showKey:true});
  const packData=stageContextData();
  try{stageOffline.prepare({userId:appCurrentUser.id,contextId:packData.contextId,event:packData.event,songs:packData.songs,preferences:activeStagePreferences});}catch(error){showToast('⚠️ Espaço offline limitado; o palco continuará disponível');}
  stageMode=true;scrollSpeed=activeStagePreferences.autoScrollSpeed;
  vd.classList.add('stage-mode',`stage-theme-${activeStagePreferences.theme}`,`stage-content-${activeStagePreferences.contentMode}`);
  vd.classList.toggle('stage-edit-locked',activeStagePreferences.editLock);
  vd.classList.toggle('stage-controls-always',activeStagePreferences.controlsMode==='always');
  vd.classList.toggle('stage-controls-hidden-permanent',activeStagePreferences.controlsMode==='hidden');
  vd.style.setProperty('--stage-chord-size',activeStagePreferences.fontSize+'px');
  vd.style.setProperty('--stage-lyric-size',Math.max(18,activeStagePreferences.fontSize-2)+'px');
  const btn=document.getElementById('btn-palco');btn.classList.add('active');btn.textContent='✕ Sair do Palco';
  youtubePlayerUI.hide();
  renderDetail();vd.querySelectorAll('details').forEach(block=>block.open=true);updatePlaylistNavigation();updateStagePresentation();measureStageHeader();
  vd.addEventListener('pointerdown',revealStageControls,{passive:true});
  if(activeStagePreferences.fullscreen&&vd.requestFullscreen){try{await vd.requestFullscreen({navigationUI:'hide'});}catch(error){}}
  if(activeStagePreferences.wakeLock)await acquireStageWakeLock();
  if(activeStagePreferences.autoScroll)startAutoScroll();
  revealStageControls();showToast('🎤 Modo Palco preparado');
}

async function acquireStageWakeLock(){if(!stageMode||!navigator.wakeLock?.request)return;try{stageWakeLock=await navigator.wakeLock.request('screen');stageWakeLock.addEventListener('release',()=>{stageWakeLock=null;});}catch(error){stageWakeLock=null;}}
async function exitStageMode(restorePlayer=true){
  const vd=document.getElementById('view-detail');stopAutoScroll();clearTimeout(stageControlsTimer);vd.removeEventListener('pointerdown',revealStageControls);
  if(stageWakeLock){try{await stageWakeLock.release();}catch(error){}stageWakeLock=null;}
  if(document.fullscreenElement===vd&&document.exitFullscreen){try{await document.exitFullscreen();}catch(error){}}
  stageMode=false;vd.className=vd.className.split(/\s+/).filter(name=>!name.startsWith('stage-')).join(' ');vd.style.removeProperty('--stage-chord-size');vd.style.removeProperty('--stage-lyric-size');
  const btn=document.getElementById('btn-palco');if(btn){btn.classList.remove('active');btn.textContent='Modo Palco';}
  document.getElementById('stage-quick-panel').hidden=true;renderDetail();updatePlaylistNavigation();const currentSong=currentDetailSongOverride||musicas.find(song=>String(song.id)===String(currentDetailId));if(restorePlayer&&currentSong)youtubePlayerUI.showSong(currentSong);
}

function currentStageSongAt(index){

function parseBlocks(raw){
  const lines=raw.trim().split('\n');
  const blocks=[]; let cur=null;
  lines.forEach(l=>{
    const lt=l.trim();
    if(!lt){ // linha vazia = nova estrofe
      if(cur && cur.c.trim()) { blocks.push(cur); cur=null; }
      return;
    }
    // [Bloco] ou *Bloco* = label
    if((lt.startsWith('[')&&lt.endsWith(']'))||(lt.startsWith('*')&&lt.endsWith('*')&&!lt.slice(1,-1).includes('*'))){
      if(cur && cur.c.trim()) blocks.push(cur);
      const label = lt.startsWith('[') ? lt.slice(1,-1) : lt;
      cur={l:label, c:''};
    } else {
      if(!cur) cur={l:'',c:''};
      cur.c+=(cur.c?'\n':'')+lt;
    }
  });
  if(cur && cur.c.trim()) blocks.push(cur);
  return blocks.length?blocks:[{l:'',c:raw}];
}

function eventKeyShift(fromKey,toKey){
  const root=value=>String(value||'').match(/^[A-G](?:#|b)?/)?.[0]||'';
  const from=noteIdx(root(fromKey)),to=noteIdx(root(toKey));
  return from<0||to<0?0:(to-from+12)%12;
}
function transposeEventChordText(value,semitones){
  if(!semitones)return String(value||'');
  return String(value||'').split(/(\r?\n)/).map(line=>songFormat.chordLine(line)?shiftText(line,semitones):line).join('');
}
function eventSongModel(song,edit,fallbackEdit){
  const base=songFormat.fromLegacy(song),primary=edit||{},fallback=fallbackEdit||{},complete=Boolean(primary.title||primary.chordSheet);
  const title=primary.title||fallback.title||base.title,key=primary.key||fallback.key||base.originalKey;
  const artist=complete?primary.artist:(primary.artist||fallback.artist||base.artist),capoValue=complete?primary.capo:(primary.capo||fallback.capo||String(base.capo||''));
  const sourceKey=primary.chordSheet?primary.key:fallback.chordSheet?fallback.key:base.originalKey;
  const chordSheet=transposeEventChordText(primary.chordSheet||fallback.chordSheet||songFormat.simpleText(base),eventKeyShift(sourceKey,key));
  const sections=songFormat.sectionsFromSimpleText(chordSheet,base),fullChordSheet=base.fullChordSheet?.content?{...base.fullChordSheet,content:transposeEventChordText(base.fullChordSheet.content,eventKeyShift(base.originalKey,key))}:base.fullChordSheet;
  return songFormat.normalize({...base,title,artist,originalKey:key,currentKey:key,capo:songFormat.parseCapo(capoValue),sections,fullChordSheet});
}

}

async function syncEventsNow(silent){
  if(eventSyncRunning)return;
  eventSyncRunning=true;
  const button=document.getElementById('event-sync-action'),status=document.getElementById('event-sync-status');
  if(button)button.disabled=true;if(status)status.textContent='Postando alterações…';
  try{
    await eventCollaboration.ensureRegistered(appCurrentUser);
    await eventCollaboration.flushEventDeletionQueue();
    const failures=[];
    for(const localEvent of [...setlists]){
      if(localEvent.syncState!=='pending'||!localEvent.pendingShared||!eventModel.isLeader(localEvent,appCurrentUser.id))continue;
      try{const synced=await eventCollaboration.saveSharedEvent(localEvent,appCurrentUser);setlists=eventRepository.upsert(setlists,synced).events;}
      catch(error){failures.push({eventId:String(localEvent.id),status:error.status||null,codigo:error.code||null,mensagem:error.message||null,requestId:error.requestId||null});console.warn('Evento preservado para nova tentativa.',failures[failures.length-1]);}
    }
    for(const synced of await eventCollaboration.flushPersonalQueue(appCurrentUser))setlists=eventRepository.upsert(setlists,synced).events;
    const remote=await eventCollaboration.listEvents(appCurrentUser);
    setlists=eventRepository.reconcileRemote(setlists,remote);eventRepository.save(setlists);renderSetlists();
    await refreshBands(true);
    if(status)status.textContent=failures.length?'Alguns Eventos aguardam nova tentativa':'Compartilhamento concluído';if(!silent)showToast(failures.length?'⚠️ Alguns Eventos continuam salvos neste dispositivo':'✅ Alterações compartilhadas');
  }catch(error){if(status)status.textContent='Modo offline — dados preservados neste dispositivo';if(!silent)showToast('⚠️ '+(error.message||'Sincronização indisponível'));}
  finally{eventSyncRunning=false;if(button)button.disabled=false;}
}

const EVENT_NOTICE_READ_KEY='sc_event_notice_read_v1';
function eventNoticeReadIds(eventId){
  const state=storage.get(EVENT_NOTICE_READ_KEY,{}),userState=state&&state[String(appCurrentUser.id)]||{};
  return new Set(Array.isArray(userState[String(eventId)])?userState[String(eventId)]:[]);
}
function eventUnreadNotices(event){const read=eventNoticeReadIds(event.id);return event.notifications.filter(notice=>!read.has(String(notice.id)));}
function markEventNoticesRead(event){
  const state=storage.get(EVENT_NOTICE_READ_KEY,{}),userId=String(appCurrentUser.id),userState={...(state&&state[userId]||{})};
  userState[String(event.id)]=event.notifications.map(notice=>String(notice.id)).slice(-50);
  storage.set(EVENT_NOTICE_READ_KEY,{...(state||{}),[userId]:userState});
}

const eventOfficialKeyBusy=new Set();
async function changeEventOfficialKey(eventId,itemId,direction){
  const event=findEvent(eventId),item=event?.repertoire.find(value=>String(value.id)===String(itemId)),song=item&&musicas.find(value=>String(value.id)===String(item.songId));
  if(!event||!item||!song)return;
  const actor=eventPermissionActor(event);
  if(!eventModel.canEditShared(event,actor.id)){showToast('🔒 Somente o líder pode alterar o tom oficial.');return;}
  const baseKey=item.shared.key||song.key||'',nextKey=shiftText(baseKey,direction<0?-1:1),busyKey=String(eventId)+':'+String(itemId);
  if(!baseKey||nextKey===baseKey){showToast('⚠️ Defina um tom original válido na edição da música.');return;}
  if(eventOfficialKeyBusy.has(busyKey))return;
  eventOfficialKeyBusy.add(busyKey);
  const control=[...document.querySelectorAll('.event-official-key-control')].find(value=>value.dataset.itemId===String(itemId));
  control?.querySelectorAll('button').forEach(button=>button.disabled=true);
  try{
    const changes={...item.shared,key:nextKey,updatedAt:new Date().toISOString()};
    if(changes.chordSheet)changes.chordSheet=transposeEventChordText(changes.chordSheet,direction<0?-1:1);
    let updated=eventModel.applySharedEdit(event,itemId,actor.id,changes);
    updated=eventModel.withSharedChange(eventModel.create({...updated,syncState:'pending',pendingShared:true}),actor,'repertoire.key.updated',`alterou o tom oficial para ${nextKey}`);
    try{updated=updated.remoteVersion==null?await eventCollaboration.saveSharedEvent(updated,appCurrentUser):await eventCollaboration.saveSharedItem(updated,itemId,changes,appCurrentUser);}
    catch(error){if(!collaborationAllowsOffline(error))throw error;}
    setlists=eventRepository.upsert(setlists,updated).events;eventRepository.save(setlists);
    try{eventChat.sendSystem(updated.id,(actor.name||'O líder')+' alterou o tom oficial para '+nextKey+'.');}catch(error){}
    const position=document.getElementById('view-sd').scrollTop;openSD(updated.id);document.getElementById('view-sd').scrollTop=position;
    showToast(`🎵 Tom oficial: ${nextKey}`);
  }catch(error){showToast('⚠️ '+error.message);}
  finally{eventOfficialKeyBusy.delete(busyKey);control?.querySelectorAll('button').forEach(button=>button.disabled=false);}
}

  event=eventModel.create({...event,syncState:'pending',pendingShared:scope==='shared'||event.pendingShared});

function eventChatButton(label,handler,className){const button=document.createElement('button');button.type='button';button.textContent=label;button.className=className||'';button.addEventListener('click',handler);return button;}
function renderEventChatMessages(scrollEnd){
  const event=findEvent(currentSdId),target=document.getElementById('event-chat-messages');if(!event||!target||document.getElementById('event-chat-view').hidden)return;
  let all=[];try{all=eventChat.list(event.id,10000);}catch(error){target.textContent=error.message;return;}target.textContent='';
  if(all.length>chatLimit)target.appendChild(eventChatButton('Carregar mensagens anteriores',()=>{chatLimit+=40;renderEventChatMessages(false);},'event-chat-load'));
  const visible=all.slice(-chatLimit),byId=new Map(all.map(message=>[String(message.id),message]));
  visible.forEach(message=>{
    const mine=String(message.sender.id)===String(appCurrentUser.id);const row=document.createElement('article');row.className='event-message '+(mine?'mine ':'')+(message.type==='system'?'system':'');
    if(message.type!=='system'){const avatar=document.createElement('div');avatar.className='event-message-avatar';if(message.sender.avatarUrl){const image=document.createElement('img');image.src=message.sender.avatarUrl;image.alt='';avatar.appendChild(image);}else avatar.textContent=eventInitials(message.sender.name);row.appendChild(avatar);}
    const bubble=document.createElement('div');bubble.className='event-message-bubble';
    if(message.type==='system'){const content=document.createElement('div');content.className='event-message-content';content.textContent=message.content;bubble.appendChild(content);}
    else{
      if(!mine){const author=document.createElement('span');author.className='event-message-author';author.textContent=message.sender.name;bubble.appendChild(author);}
      if(message.replyTo&&byId.has(String(message.replyTo))){const quote=document.createElement('div');quote.className='event-message-reply-quote';const original=byId.get(String(message.replyTo));quote.textContent=(original.sender.name||'')+': '+(original.content||original.poll&&original.poll.question||'Mensagem');bubble.appendChild(quote);}
      if(message.type==='poll')renderPollMessage(bubble,event.id,message);
      else{const content=document.createElement('div');content.className='event-message-content';content.textContent=message.deleted?'Mensagem excluída':message.content+(message.editedAt?' (editada)':'');bubble.appendChild(content);}
      if(!message.deleted){const reactions=document.createElement('div');reactions.className='event-message-actions';['👍','❤️','🙏'].forEach(emoji=>{const count=(message.reactions&&message.reactions[emoji]||[]).length;if(count){const chip=eventChatButton(emoji+' '+count,()=>eventChat.react(event.id,message.id,emoji),'event-reaction');if((message.reactions[emoji]||[]).includes(appCurrentUser.id))chip.classList.add('active');reactions.appendChild(chip);}});bubble.appendChild(reactions);
        const actions=document.createElement('div');actions.className='event-message-actions';actions.append(eventChatButton('Responder',()=>replyEventMessage(message.id)),eventChatButton('👍',()=>eventChat.react(event.id,message.id,'👍')),eventChatButton('Copiar',()=>copyChatMessage(message)));if(mine&&message.type==='text'){actions.append(eventChatButton('Editar',()=>editChatMessage(message)),eventChatButton('Excluir',()=>deleteChatMessage(message)));}bubble.appendChild(actions);}
    }
    const time=document.createElement('span');time.className='event-message-time';time.textContent=new Date(message.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});bubble.appendChild(time);row.appendChild(bubble);target.appendChild(row);
  });
  eventChat.markRead(event.id);if(scrollEnd)requestAnimationFrame(()=>{target.scrollTop=target.scrollHeight;});
}
function renderPollMessage(bubble,eventId,message){const title=document.createElement('div');title.className='event-poll-question';title.textContent='📊 '+message.poll.question;bubble.appendChild(title);const uniqueVoters=new Set(Object.values(message.poll.votes||{}).flat());message.poll.options.forEach(option=>{const voters=message.poll.votes[option.id]||[],percent=uniqueVoters.size?Math.round(voters.length/uniqueVoters.size*100):0;const item=document.createElement('div');item.className='event-poll-option'+(voters.includes(appCurrentUser.id)?' selected':'');item.addEventListener('click',()=>eventChat.vote(eventId,message.id,option.id));const fill=document.createElement('span');fill.className='event-poll-option-fill';fill.style.width=percent+'%';const content=document.createElement('span');content.className='event-poll-option-content';const votersText=message.poll.showVoters&&voters.length?' · '+voters.map(id=>{const member=findEvent(eventId).members.find(value=>String(value.id)===String(id));return member?member.name:(String(id)===String(appCurrentUser.id)?appCurrentUser.name:'Membro');}).join(', '):'';content.innerHTML='<span>'+eventEsc(option.label)+eventEsc(votersText)+'</span><strong>'+voters.length+' · '+percent+'%</strong>';item.append(fill,content);bubble.appendChild(item);});const total=document.createElement('span');total.className='event-poll-total';total.textContent=uniqueVoters.size+' participante(s) votaram';bubble.appendChild(total);}

async function migrateLegacyEventsInBackground(){
  if(!eventMigrationCandidate||!currentAuthState.authenticated||!setlists.length)return;
  try{
    const original=eventModel.normalizeCollection(setlists),existingRemote=await eventCollaboration.listEvents(appCurrentUser);
    const batch=await eventRepository.uploadMigrationCandidates(original,existingRemote,localEvent=>eventCollaboration.saveSharedEvent({...localEvent,remoteVersion:null,syncState:'pending',pendingShared:true},appCurrentUser,{legacyMigration:true}),failure=>console.warn('Evento legado preservado para nova tentativa.',failure));
    const remote=await eventCollaboration.listEvents(appCurrentUser),remoteIds=new Set(remote.map(event=>String(event.id)));
    const missing=original.filter(event=>!remoteIds.has(String(event.id)));
    setlists=eventRepository.reconcileRemote(original,remote);eventRepository.save(setlists);renderSetlists();
    if(missing.length){console.warn('Migração de Eventos incompleta; itens locais foram preservados.',{missingEventIds:missing.map(event=>String(event.id)),failures:batch.failures});eventBackgroundSyncReady=true;return;}
    if(!eventRepository.confirmActiveOwner(setlists))throw new Error('Não foi possível confirmar o cache desta conta.');
    eventMigrationCandidate=false;eventBackgroundSyncReady=true;renderSetlists();
  }catch(error){eventBackgroundSyncReady=true;console.warn('Migração de Eventos preservada para nova tentativa.',error);}
}

appAuth.subscribe(async state=>{
  currentAuthState=state;renderAccountButton();
  if(!state.authenticated){
    appIdentity=eventCollaboration.ensureLocalIdentity(legacyCurrentUser);
    appCurrentUser=Object.freeze({...appIdentity.user});
    appCurrentUser=Object.freeze({...appCurrentUser,...accountProfile()});
    appBands=[];eventBackgroundSyncReady=false;renderAccountButton();renderSetlists();renderBandToolbar();showEventInvitationLogin();return;
  }
  if(authLinking||!state.authenticated||!state.user)return;
  authLinking=true;
  const previousUser=appCurrentUser;
  try{
    appIdentity=await eventCollaboration.ensureRegistered(previousUser);
    if(!currentAuthState.authenticated||currentAuthState.user?.id!==state.user.id)return;
    appCurrentUser=Object.freeze({...appIdentity.user,role:previousUser.role||'Liderança'});
    const activation=eventRepository.activateOwner(appCurrentUser.id,setlists,appCurrentUser,[previousUser.id,...(appIdentity.legacyUserIds||[])]);
    setlists=activation.events;eventMigrationCandidate=activation.migrationCandidate;
    appCurrentUser=Object.freeze({...appCurrentUser,...accountProfile()});
    if(document.getElementById('event-current-user-id'))document.getElementById('event-current-user-id').textContent='Seu ID: '+appCurrentUser.id;
    const acceptedInvitation=await acceptPendingEventInvitation();
    const remoteEvents=await eventCollaboration.listEvents(appCurrentUser);
    setlists=eventRepository.reconcileRemote(setlists,remoteEvents);eventRepository.save(setlists);
    if(acceptedInvitation){await refreshBands(true);switchTab('setlists');closeModal();}
    eventBackgroundSyncReady=true;
    renderAccountButton();renderSetlists();renderBandToolbar();
    if(eventMigrationCandidate&&promptedEventMigrationOwner!==String(appCurrentUser.id)){promptedEventMigrationOwner=String(appCurrentUser.id);setTimeout(()=>migrateLegacyEventsInBackground(),0);}
  }catch(error){showToast('⚠️ Não foi possível consultar sua conta. Tente novamente pela área de equipes.');}finally{authLinking=false;}
});
