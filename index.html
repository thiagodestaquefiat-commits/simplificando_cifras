<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplificando Cifras</title>
<meta name="theme-color" content="#07111f">
<meta name="description" content="App de cifras com playlist musical, eventos, repertórios, membros, chat, medley e modo palco.">
<meta name="sc-api-base-url" content="https://simplificandocifras-production.up.railway.app">
<link rel="manifest" href="manifest.webmanifest?v=10">
<link rel="icon" href="assets/icons/pwa-icon-v10-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="assets/icons/pwa-icon-v10-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/pwa-icon-v10-192.png" sizes="192x192">
<link rel="stylesheet" href="js/editor/song-editor.css">
<link rel="stylesheet" href="js/ai/ai-harmonic-summary.css?v=2">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a1a2e;--bg2:#22223b;--bg3:#2d2d44;
  --accent:#d97757;--accent2:rgba(217,119,87,0.18);
  --text:#ede8e3;--text2:#9b95a3;
  --chord-color:#E8896B;
  --music-accent:#E8896B;
  --border:rgba(255,255,255,0.08);
  --danger:#e05c6a;
}
html,body{width:100%;min-height:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;justify-content:center;min-height:100vh;}
.app{width:100%;max-width:720px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 32px rgba(0,0,0,.18);}
/* TOPBAR */
.topbar{background:var(--bg2);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.topbar-icon{font-size:22px;}
.topbar-info{flex:1;min-width:0;}
.topbar-title{font-size:17px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:var(--accent);margin-top:1px;}
.export-library-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:7px 9px;font:600 11px/1.2 inherit;cursor:pointer;white-space:nowrap;}
.export-library-btn:hover{background:var(--accent2);}
/* TABS */
.tab-bar{background:var(--bg2);display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;font-weight:500;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* SEARCH */
.search-bar{padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--border);}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;}
.search-input{width:100%;background:var(--bg3);border:none;border-radius:9px;padding:8px 13px 8px 34px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
.search-input::placeholder{color:var(--text2);}
/* LIST */
.content{flex:1;overflow-y:auto;padding-bottom:72px;}
.section-label{padding:7px 15px 3px;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--bg);}
.music-item{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.music-item:hover{background:var(--bg2);}
.music-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.music-info{flex:1;min-width:0;}
.music-title{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.music-sub{font-size:13px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.key-badge{font-size:13px;background:rgba(232,137,107,.14);color:var(--music-accent);padding:4px 10px;border-radius:10px;font-weight:700;flex-shrink:0;}
/* FAB */
.fab{position:fixed;bottom:22px;right:max(16px,calc((100vw - 720px)/2 + 16px));width:54px;height:54px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 4px 16px rgba(217,119,87,.4);transition:transform .15s;font-size:26px;color:#fff;font-weight:300;}
.fab:hover{transform:scale(1.06);}
/* DETAIL VIEW */
.detail-view{display:none;position:fixed;inset:0 auto 0 50%;transform:translateX(-50%);width:100%;max-width:720px;height:100dvh;background:var(--bg);overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;flex-direction:column;z-index:10;box-shadow:0 0 32px rgba(0,0,0,.28);}
.detail-header{background:var(--bg2);padding:13px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.back-btn{color:var(--accent);font-size:24px;cursor:pointer;flex-shrink:0;line-height:1;}
.detail-title-wrap{flex:1;min-width:0;}
.detail-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-artist{font-size:13px;color:var(--text2);margin-top:2px;}
.detail-capo{font-size:12px;color:var(--text2);margin-top:2px;}
.detail-key-badge{font-size:13px;background:rgba(232,137,107,.14);color:var(--music-accent);padding:4px 11px;border-radius:10px;font-weight:700;flex-shrink:0;}
/* TRANSPOSITOR */
.transpose-bar{margin:12px 14px 4px;background:var(--bg3);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.transpose-label{font-size:13px;color:var(--text2);flex:1;}
.transpose-semitone{font-size:12px;color:var(--text2);min-width:24px;text-align:center;}
.t-btn{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-family:inherit;}
.t-btn:hover{background:var(--accent2);color:var(--accent);border-color:var(--accent);}
.transpose-key{font-size:17px;font-weight:700;color:var(--music-accent);min-width:40px;text-align:center;}
.t-reset{font-size:12px;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;font-family:inherit;transition:all .15s;}
.t-reset:hover{border-color:var(--accent);color:var(--accent);}
/* CAPO BANNER */
.capo-banner{margin:10px 14px 0;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;border:2px solid;}
.capo-banner.on{background:rgba(255,200,0,0.12);border-color:rgba(255,200,0,0.5);}
.capo-banner.off{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.1);}
.capo-icon{font-size:24px;flex-shrink:0;}
.capo-info{flex:1;}
.capo-title{font-size:14px;font-weight:700;}
.capo-banner.on .capo-title{color:#ffc800;}
.capo-banner.off .capo-title{color:var(--text2);}
.capo-sub{font-size:12px;margin-top:1px;}
.capo-banner.on .capo-sub{color:rgba(255,200,0,0.7);}
.capo-banner.off .capo-sub{color:var(--text2);}
.capo-toggle{width:42px;height:24px;border-radius:12px;position:relative;transition:background .2s;flex-shrink:0;}
.capo-banner.on .capo-toggle{background:#ffc800;}
.capo-banner.off .capo-toggle{background:var(--bg3);}
.capo-toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;transition:left .2s;}
.capo-banner.on .capo-toggle::after{left:21px;}
.capo-banner.off .capo-toggle::after{left:3px;}
/* SPOTIFY SEARCH */
.spotify-panel{padding:8px 14px 10px;background:var(--bg2);border-bottom:1px solid var(--border)}
.spotify-account-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:11px;color:var(--text2)}
.spotify-account-row span.connected{color:#86efac}
.spotify-auth-btn{border:0;background:transparent;color:#1ed760;font:700 11px inherit;cursor:pointer}
.spotify-search-bar{background:var(--bg3);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);transition:border-color .2s}
.spotify-search-bar:focus-within{border-color:#1ed760}
.spotify-search-input{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.spotify-search-input::placeholder{color:var(--text2)}
.spotify-search-btn,.spotify-add-btn{background:#1db954;border:none;border-radius:8px;color:#07110b;font-size:12px;font-weight:800;padding:7px 12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.spotify-search-btn:disabled{opacity:.5;cursor:not-allowed}
.spotify-results{margin:8px 14px 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg3);overflow:hidden;max-height:310px;overflow-y:auto}
.spotify-results-title,.spotify-message{padding:10px 12px;color:var(--text2);font-size:12px}
.spotify-message.error{color:#fca5a5}.spotify-message.loading{color:#93c5fd}
.spotify-track{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--border)}
.spotify-track-cover{width:42px;height:42px;border-radius:7px;object-fit:cover;flex-shrink:0}.spotify-track-cover.placeholder{display:grid;place-items:center;background:#17231c;color:#1ed760}
.spotify-track-info{flex:1;min-width:0}.spotify-track-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spotify-track-sub{margin-top:3px;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-sel-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--accent2);transition:opacity .15s;}
.pl-sel-row.dragging{opacity:.4;}
.pl-add-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.pl-add-row:hover{background:var(--bg2);}
/* CAPO SELECTOR */
.capo-opt{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500;transition:all .15s;flex-shrink:0;}
.capo-opt.active{background:var(--music-accent);color:#fff;border-color:var(--music-accent);}
/* INSTRUMENT TABS (compacto) */
.inst-tab{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;}
.inst-tab.active{background:var(--accent2);border-color:rgba(217,119,87,0.4);}
/* CHORD STRIP */
.chord-strip-wrap{display:flex;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:12px 16px 15px;scroll-padding-inline:16px;gap:10px;background:var(--bg2);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--accent) var(--bg3);}
.chord-strip-wrap::-webkit-scrollbar{height:6px;}
.chord-strip-wrap::-webkit-scrollbar-track{background:var(--bg3);border-radius:6px;}
.chord-strip-wrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:6px;}
.chord-card{display:flex;flex:0 0 auto;min-width:146px;max-width:none;min-height:176px;padding:10px 12px;text-align:center;align-items:center;justify-content:flex-start;flex-direction:column;border:1px solid var(--border);border-radius:14px;background:var(--bg);scroll-snap-align:start;}
.chord-card-name{width:100%;min-height:20px;margin-bottom:5px;color:var(--chord-color);font:700 13px/1.25 Arial,sans-serif;white-space:nowrap;overflow:visible;text-align:center;}
.chord-tuning{max-width:240px;margin-top:7px;color:var(--music-accent);font:600 9px/1.35 Inter,Arial,sans-serif;text-align:center;}
.keyboard-card{min-width:278px;}
.chord-card svg{display:block;flex:none;max-width:none;}
.chord-card-unavailable{min-width:144px;justify-content:center;}
.chord-unavailable-message{max-width:120px;color:var(--text2);font-size:11px;line-height:1.35;}
/* CHORD BLOCKS - estilo WhatsApp com blocos */
.detail-body{padding:16px 20px;}
.wa-block{background:var(--bg3);border-radius:10px;border:1px solid var(--border);padding:14px 16px;margin-bottom:14px;}
.chord-line{font-family:Arial,sans-serif;font-size:22px;color:var(--chord-color);letter-spacing:.5px;line-height:1.8;font-weight:600;}
.letra-linha{font-family:Arial,sans-serif;font-size:20px;font-weight:700;color:#ffffff;margin:4px 0 0;}
/* MODO PALCO */
.stage-mode .detail-header .back-btn,
.stage-mode #capo-banner,
.stage-mode .stage-hide{display:none!important;}
.stage-mode #chord-diagrams-section,
.stage-mode #inst-modal,
.stage-mode #spotify-song-player{display:none!important;}
.stage-mode .chord-block{background:transparent;border:none;margin-bottom:8px;}
.stage-mode .chord-block summary{font-size:20px;padding:6px 0;}
.stage-mode .chord-line{font-size:var(--stage-chord-size,28px);line-height:2.2;}
.stage-mode .detail-body{padding:12px clamp(10px,3vw,28px);}
/* TOOLBAR PALCO */
.stage-toolbar{display:flex;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;}
.stage-toolbar[hidden]{display:none!important;}
.stage-btn[hidden]{display:none!important;}
.stage-only-control{display:none!important;}
.stage-mode .stage-only-control{display:flex!important;}
.stage-btn:disabled{opacity:.38;cursor:not-allowed;}
.stage-btn{flex:1;padding:8px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
.stage-btn-palco{background:rgba(217,119,87,.15);color:var(--accent);border:1.5px solid var(--accent);}
.stage-btn-palco.active{background:var(--accent);color:#fff;}
.stage-btn-scroll{background:rgba(100,200,100,.12);color:#6dc46d;border:1.5px solid #6dc46d;}
.stage-btn-scroll.active{background:#6dc46d;color:#fff;}
/* MEDLEY */
.medley-block{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1.5px solid rgba(217,119,87,0.3);}
.medley-block-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.medley-source{font-size:12px;color:var(--accent);font-weight:700;flex:1;}
.medley-order-btns{display:flex;gap:4px;}
.medley-order-btn{width:28px;height:28px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.medley-remove{width:28px;height:28px;border-radius:6px;background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* BUTTONS */
.btn{width:100%;padding:11px;border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:9px;font-family:inherit;transition:opacity .15s;}
.btn-primary{background:var(--accent);}
.btn-primary:hover{opacity:.88;}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);margin-top:8px;}
.btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);margin-top:7px;}
.btn-row{display:flex;gap:8px;margin-top:12px;}
.btn-row .btn{margin:0;flex:1;padding:9px;font-size:13px;}
/* SETLISTS */
.setlist-item{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.setlist-item:hover{background:var(--bg2);}
.sl-avatar{width:40px;height:40px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sl-info{flex:1;min-width:0;}
.sl-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl-sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl-count{font-size:11px;background:var(--bg3);color:var(--text2);padding:3px 8px;border-radius:10px;flex-shrink:0;}
/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);z-index:30;display:none;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:620px;padding:18px 16px 24px;max-height:92dvh;overflow-x:hidden;overflow-y:auto;}
.modal-handle{width:34px;height:3px;background:var(--bg3);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.form-group{margin-bottom:11px;}
.form-label{font-size:11px;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.form-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
.form-input:focus{border-color:var(--accent);}
.form-textarea{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;min-height:130px;resize:vertical;line-height:1.6;}
.form-textarea:focus{border-color:var(--accent);}
/* CHIPS */
.chips-wrap{display:flex;flex-wrap:wrap;margin-top:5px;max-height:170px;overflow-y:auto;gap:4px;}
.chip{display:inline-flex;background:var(--bg3);color:var(--text2);padding:5px 10px;border-radius:12px;font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;font-weight:500;}
.chip.selected{background:var(--accent2);color:var(--accent);border-color:var(--accent);}
/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2);}
.empty-state .emoji{font-size:44px;margin-bottom:12px;}
.empty-state p{font-size:14px;}
/* SD numbered */
.sd-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.sd-num{width:24px;height:24px;background:var(--accent2);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
@media (max-width:520px){
  .app{box-shadow:none;}
  .detail-view{box-shadow:none;}
}
@media (max-width:360px){
  .topbar{padding:11px 8px;gap:7px;}
  .topbar-icon{font-size:19px;}
  .topbar-title{font-size:15px;}
  .export-library-btn{padding:6px 7px;font-size:10px;}
  .tab{font-size:12px;padding-inline:2px;}
  .transpose-bar{margin-inline:8px;padding:8px;gap:5px;}
  .transpose-label{display:none;}
  .stage-toolbar{padding:8px;gap:4px;}
  .stage-btn{min-width:0;padding:7px 4px;font-size:11px;}
  .detail-body{padding-inline:12px;}
}
/* IDENTIDADE VISUAL 2026 — somente apresentação */
:root{--bg:#07111f;--bg2:#0b1728;--bg3:#111f33;--surface:#0e1c2f;--surface-hover:#142640;--accent:#2563eb;--accent-hover:#3b82f6;--accent2:rgba(37,99,235,.16);--success:#22c55e;--success-soft:rgba(34,197,94,.13);--text:#f8fafc;--text2:#94a3b8;--border:rgba(148,163,184,.15);--danger:#f87171;--shadow:0 18px 50px rgba(0,0,0,.28);--music-accent:#E8896B}
html{background:#050b14}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(circle at 12% 4%,rgba(37,99,235,.15),transparent 30rem),radial-gradient(circle at 88% 96%,rgba(34,197,94,.08),transparent 26rem),#050b14}
button,input,textarea,select{font:inherit}
button,.tab,.music-item,.setlist-item,.fab,.chip,.capo-opt{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.music-item:focus-visible{outline:3px solid rgba(59,130,246,.45);outline-offset:2px}
.app{max-width:720px;background:linear-gradient(180deg,rgba(11,23,40,.98),var(--bg) 22%);border-inline:1px solid rgba(148,163,184,.08);box-shadow:0 0 70px rgba(0,0,0,.42)}
.topbar{min-height:78px;padding:14px 18px;gap:13px;background:rgba(7,17,31,.88);border-bottom:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

 srgb,var(--stage-text) 9%,transparent);color:var(--stage-text);font-size:9px;font-weight:900;white-space:nowrap}.stage-online-status{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.13)}.stage-online-status.offline{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.13)}.stage-mode .stage-next-preview{display:flex;margin:8px clamp(10px,3vw,28px) 0;padding:8px 11px;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--stage-text) 10%,transparent);border-radius:11px;background:color-mix(in srgb,var(--stage-text) 5%,transparent);color:var(--stage-muted);font-size:9px}.stage-next-preview strong{min-width:0;overflow:hidden;color:var(--stage-text);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.stage-next-preview span:last-child{margin-left:auto;white-space:nowrap}.stage-mode .detail-body{padding-top:14px;padding-bottom:112px;background:var(--stage-surface);color:var(--stage-text)}.stage-mode .wa-block,.stage-mode .full-chord-sheet{border:0;background:transparent;box-shadow:none}.stage-mode .wa-block{padding:4px 0;margin-bottom:16px}.stage-mode .full-chord-sheet{display:block;padding:4px 0}.stage-mode .full-chord-private{display:none}.stage-mode .letra-linha,.stage-mode .full-chord-line:not(.is-chord):not(.is-section){color:var(--stage-text);font-size:var(--stage-lyric-size,var(--stage-chord-size,28px));line-height:1.55}.stage-mode .full-chord-line.is-chord{font-size:var(--stage-chord-size,28px);line-height:1.7}.stage-mode .full-chord-line.is-section{color:var(--stage-accent);font-size:calc(var(--stage-chord-size,28px) * .55)}.stage-content-lyrics .chord-line,.stage-content-lyrics .full-chord-line.is-chord{display:none}.stage-content-chords .letra-linha,.stage-content-chords .full-chord-line:not(.is-chord):not(.is-section){display:none}.stage-structure-view{display:grid;gap:10px}.stage-structure-card{padding:14px;border-left:4px solid var(--stage-accent);border-radius:9px;background:color-mix(in srgb,var(--stage-text) 5%,transparent)}.stage-structure-card strong{display:block;color:var(--stage-accent);font-size:12px;text-transform:uppercase}.stage-structure-card span{display:block;margin-top:7px;color:var(--stage-text);font:700 var(--stage-chord-size,28px)/1.5 Arial,sans-serif}.stage-mode .stage-floating-controls{position:fixed;z-index:28;right:50%;bottom:max(12px,env(safe-area-inset-bottom));display:flex;max-width:calc(100% - 24px);padding:7px;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--stage-text) 15%,transparent);border-radius:18px;background:var(--stage-panel);box-shadow:0 14px 34px rgba(0,0,0,.34);backdrop-filter:blur(15px);transform:translateX(50%);transition:opacity .2s,transform .2s}.stage-control{display:grid;min-width:42px;height:42px;padding:0 10px;place-items:center;border:0;border-radius:11px;background:transparent;color:var(--stage-text);font-size:15px;font-weight:900;cursor:pointer}.stage-control:hover,.stage-control.active{background:color-mix(in srgb,var(--stage-text) 12%,transparent)}.stage-control.primary{min-width:52px;background:var(--stage-accent);color:var(--stage-surface)}.stage-controls-hidden .stage-performance-header{opacity:0;pointer-events:none;transform:translateY(-105%)}.stage-controls-hidden .stage-floating-controls{opacity:0;pointer-events:none;transform:translate(50%,130%)}.stage-controls-always .stage-performance-header,.stage-controls-always .stage-floating-controls{opacity:1!important;pointer-events:auto!important}.stage-controls-hidden-permanent .stage-performance-header,.stage-controls-hidden-permanent .stage-floating-controls{display:none!important}.stage-mode .stage-quick-panel{position:fixed;z-index:32;inset:0;display:flex;padding:clamp(12px,4vw,28px);align-items:stretch;justify-content:flex-end;background:rgba(0,0,0,.58);backdrop-filter:blur(5px)}.stage-quick-panel[hidden]{display:none!important}.stage-quick-sheet{display:flex;width:min(430px,100%);padding:14px;overflow:hidden;flex-direction:column;border:1px solid color-mix(in srgb,var(--stage-text) 15%,transparent);border-radius:18px;background:var(--stage-surface);box-shadow:0 20px 55px rgba(0,0,0,.45)}.stage-quick-header{display:flex;align-items:center;gap:8px}.stage-quick-header strong{flex:1}.stage-quick-list{min-height:0;margin-top:10px;overflow-y:auto}.stage-quick-row{display:grid;width:100%;padding:10px;border:0;border-bottom:1px solid color-mix(in srgb,var(--stage-text) 10%,transparent);grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;background:transparent;color:var(--stage-text);text-align:left;cursor:pointer}.stage-quick-row.current{border-radius:10px;background:color-mix(in srgb,var(--stage-accent) 18%,transparent)}.stage-quick-row strong,.stage-quick-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage-quick-row strong{font-size:11px}.stage-quick-row small{margin-top:2px;color:var(--stage-muted);font-size:8px}.stage-quick-row>span:last-child{color:var(--stage-accent);font-size:9px;font-weight:900}.stage-mode.stage-edit-locked .ai-generate-action,.stage-mode.stage-edit-locked .btn-row{display:none!important}
@media(min-width:760px){.stage-preset-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stage-option-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stage-mode .detail-body{width:min(100%,960px);margin-inline:auto}.stage-mode .stage-next-preview{width:min(calc(100% - 56px),904px);margin-inline:auto}}
@media(max-width:560px){.stage-preset-grid,.stage-option-grid{grid-template-columns:1fr 1fr}.stage-mode .stage-performance-header{grid-template-columns:38px minmax(0,1fr) auto 38px}.stage-nav-icon{width:38px;height:38px}.stage-position,.stage-key{padding-inline:6px;font-size:8px}.stage-mode .detail-body{padding-inline:14px}.stage-mode .stage-next-preview{margin-inline:8px}.stage-floating-controls .stage-control{min-width:34px;padding-inline:5px}.stage-floating-controls .stage-control.primary{min-width:42px}.stage-speed-control{display:none!important}}
@media(orientation:landscape) and (max-height:560px){.stage-mode .stage-performance-header{min-height:50px;padding-block:4px}.stage-nav-icon{width:36px;height:36px}.stage-mode .stage-next-preview{display:none}.stage-mode .detail-body{padding-top:8px;padding-bottom:76px}.stage-mode .stage-floating-controls{bottom:6px;padding:4px}.stage-control{height:36px;min-width:36px}}
.stage-heading{cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- MAIN VIEW -->
  <div id="view-main" style="display:flex;flex-direction:column;height:100vh;">
    <div class="topbar">
      <div class="topbar-icon">🎸</div>
      <div class="topbar-info">
        <div class="topbar-title">Simplificando Cifras</div>
        <div class="topbar-sub" id="count-label"></div>
      </div>
      <button class="export-library-btn" type="button" onclick="exportarBiblioteca()" title="Baixar uma cópia completa dos dados">Exportar Biblioteca</button>
      <button class="app-account-btn" id="app-account-btn" type="button" onclick="openAccountModal()" aria-label="Abrir conta">EU</button>
    </div>
    <div class="tab-bar">
      <div class="tab active" id="tab-musicas" onclick="switchTab('musicas')">🎵 Playlist</div>
      <div class="tab" id="tab-setlists" onclick="switchTab('setlists')">📅 Eventos</div>
      <div class="tab" id="tab-medley" onclick="switchTab('medley')">🎛️ Medley</div>
    </div>
    <div id="pane-musicas" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div class="search-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input class="search-input" type="text" placeholder="Buscar música ou tom..." id="search-music" oninput="renderMusicas()">
        </div>
      </div>
      <div class="spotify-panel">
        <div class="spotify-account-row">
          <span id="spotify-status">Conecte para pesquisar músicas</span>
          <button class="spotify-auth-btn" id="spotify-auth-btn" type="button" onclick="spotifyUI.toggleConnection()">Conectar</button>
        </div>
        <div class="spotify-search-bar">
          <span aria-hidden="true">♫</span>
          <input class="spotify-search-input" id="spotify-input" placeholder="Pesquisar no Spotify" oninput="spotifyUI.scheduleSearch()" onkeydown="if(event.key==='Enter')spotifyUI.search()">
          <button class="spotify-search-btn" id="spotify-search-btn" type="button" onclick="spotifyUI.search()">Pesquisar</button>
        </div>
      </div>
      <div class="spotify-results" id="spotify-results" style="display:none;"></div>
      <button class="ai-generate-action" type="button" onclick="aiHarmonicSummary.open()">Gerar com IA</button>
      <div class="content" id="lista-musicas"></div>
    </div>
    <div id="pane-setlists" style="display:none;flex:1;overflow:hidden;flex-direction:column;">
      <div class="band-toolbar"><select id="active-band-select" onchange="selectActiveBand(this.value)" aria-label="Equipe ativa"><option value="">Todos os eventos</option></select><button type="button" onclick="openBandManager()">👥 Equipes</button></div>
      <div class="event-sync-toolbar"><div><strong id="event-sync-status">Eventos disponíveis offline</strong><small id="event-current-user-id"></small></div><button type="button" class="event-sync-action" id="event-sync-action" onclick="syncEventsNow()">Postar</button></div>
      <div class="content" id="lista-setlists"></div>
    </div>
    <div id="pane-medley" style="display:none;flex:1;overflow:hidden;">
      <div class="content" id="medley-content" style="padding:14px;"></div>
    </div>
    <div class="fab" onclick="openFab()">+</div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="detail-view" id="view-detail">
    <div class="detail-header">
      <span class="back-btn" onclick="closeDetail()">←</span>
      <div class="detail-title-wrap">
        <div class="detail-title" id="detail-title"></div>
        <div class="detail-capo" id="detail-artist-label"></div>
      </div>
      <span class="detail-key-badge" id="detail-key"></span>
    </div>
    <header class="stage-performance-header" id="stage-performance-header" aria-label="Informações da apresentação">
      <button type="button" class="stage-nav-icon" id="stage-prev" onclick="navigateSong(-1)" aria-label="Música anterior">‹</button>
      <div class="stage-heading" onclick="openStageQuickPanel()" title="Abrir repertório"><strong id="stage-song-title">Música</strong><span id="stage-song-artist"></span></div>
      <div class="stage-meta"><span class="stage-position" id="stage-position">1 / 1</span><span class="stage-key" id="stage-key">Tom —</span><span class="stage-online-status" id="stage-online-status" title="Pacote pronto para uso offline"></span></div>
      <button type="button" class="stage-nav-icon" id="stage-next" onclick="navigateSong(1)" aria-label="Próxima música">›</button>
    </header>
    <div class="stage-next-preview" id="stage-next-preview"><span>Próxima</span><strong id="stage-next-title">Fim do repertório</strong><span id="stage-next-key"></span></div>
    <span id="spotify-song-player-anchor" hidden></span>
    <section class="song-player-shell" id="spotify-song-player" aria-label="Player Spotify da música"></section>
    <!-- ACORDES + INSTRUMENTO -->
    <div id="chord-diagrams-section" style="background:var(--bg2);border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 14px 4px;">
        <span style="font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.5px;text-transform:uppercase;">Acordes</span>
        <button id="inst-btn" onclick="openInstModal()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;display:flex;align-items:center;gap:5px;">
          <span id="inst-label">🎸 Violão</span> <span style="color:var(--text2);">▾</span>
        </button>
      </div>
      <div id="chord-strip"></div>
    </div>

    <!-- MODAL DE INSTRUMENTOS -->
    <div id="inst-modal" onclick="closeInstModal(event)" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:40;align-items:flex-end;justify-content:center;">
      <div onclick="event.stopPropagation()" style="background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:420px;padding-bottom:24px;border-top:1px solid var(--border);">
        <div style="padding:16px 20px 8px;display:flex;align-items:center;gap:10px;">
          <span onclick="closeInstModal()" style="color:var(--accent);font-size:20px;cursor:pointer;">←</span>
          <span style="font-size:16px;font-weight:700;">Acordes</span>
        </div>
        <div id="inst-list"></div>
      </div>
    </div>
    <!-- CAPO SELECTOR (estilo Cifra Club) -->
    <div id="capo-row" style="background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;color:var(--text2);font-weight:600;white-space:nowrap;">🎸 Capo</span>
      <div style="display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:2px;">
        <button class="capo-opt active" id="capo-opt-0" onclick="selectCapo(0)">Sem</button>
        <button class="capo-opt" id="capo-opt-1" onclick="selectCapo(1)">1ª</button>
        <button class="capo-opt" id="capo-opt-2" onclick="selectCapo(2)">2ª</button>
        <button class="capo-opt" id="capo-opt-3" onclick="selectCapo(3)">3ª</button>
        <button class="capo-opt" id="capo-opt-4" onclick="selectCapo(4)">4ª</button>
        <button class="capo-opt" id="capo-opt-5" onclick="selectCapo(5)">5ª</button>
        <button class="capo-opt" id="capo-opt-6" onclick="selectCapo(6)">6ª</button>
        <button class="capo-opt" id="capo-opt-7" onclick="selectCapo(7)">7ª</button>
      </div>
    </div>
    <!-- TRANSPOSITOR -->
    <div class="transpose-bar">
      <span class="transpose-label">🎼 Transpor tom</span>
      <span class="transpose-semitone" id="semitone-label">+0</span>
      <button class="t-btn" onclick="transpose(-1)">−</button>
      <span class="transpose-key" id="transposed-key"></span>
      <button class="t-btn" onclick="transpose(+1)">+</button>
      <button class="t-reset" onclick="resetTranspose()">Original</button>
    </div>
    <div class="stage-toolbar">
      <button class="stage-btn stage-btn-palco" id="btn-palco" onclick="toggleStageModeBtn()">Modo Palco</button>
      <button class="stage-btn stage-btn-scroll" id="btn-scroll" onclick="toggleAutoScroll()">▶ Auto-Scroll</button>
    </div>
    <div class="stage-toolbar" aria-label="Controles de apresentação">
      <button class="stage-btn" id="btn-previous-song" onclick="navigateSong(-1)" title="Música anterior" hidden>← Anterior</button>
      <button class="stage-btn stage-only-control" id="btn-speed" onclick="cycleScrollSpeed()" title="Velocidade do auto-scroll">Vel. 1x</button>
      <button class="stage-btn stage-only-control" id="btn-font" onclick="cycleStageFont()" title="Tamanho das cifras">Fonte M</button>
      <button class="stage-btn" id="btn-next-song" onclick="navigateSong(1)" title="Próxima música" hidden>Próxima →</button>
    </div>
    <div class="stage-quick-panel" id="stage-quick-panel" hidden onclick="closeStageQuickPanel(event)">
      <section class="stage-quick-sheet" onclick="event.stopPropagation()">
        <div class="stage-quick-header"><strong>Repertório</strong><button type="button" class="stage-nav-icon" onclick="reconfigureStageMode()" aria-label="Reconfigurar Modo Palco">⚙</button><button type="button" class="stage-nav-icon" onclick="closeStageQuickPanel()" aria-label="Fechar repertório">×</button></div>
        <div class="stage-quick-list" id="stage-quick-list"></div>
      </section>
    </div>
    <nav class="stage-floating-controls" aria-label="Controles do Modo Palco">
      <button type="button" class="stage-control" onclick="adjustStageFont(-2)" aria-label="Diminuir fonte">A−</button>
      <button type="button" class="stage-control" onclick="transpose(-1)" aria-label="Descer o tom">♭</button>
      <button type="button" class="stage-control primary" id="stage-scroll-toggle" onclick="toggleAutoScroll()" aria-label="Iniciar auto-scroll">▶</button>
      <button type="button" class="stage-control" onclick="transpose(1)" aria-label="Subir o tom">♯</button>
      <button type="button" class="stage-control" onclick="adjustStageFont(2)" aria-label="Aumentar fonte">A+</button>
      <button type="button" class="stage-control stage-speed-control" data-stage-wide onclick="cycleScrollSpeed()" aria-label="Alterar velocidade do auto-scroll">1×</button>
      <button type="button" class="stage-control" data-stage-wide onclick="openStageQuickPanel()" aria-label="Abrir repertório">☷</button>
      <button type="button" class="stage-control" onclick="exitStageMode()" aria-label="Sair do Modo Palco">×</button>
    </nav>
    <div class="detail-body" id="detail-content"></div>
  </div>

  <!-- SETLIST DETAIL -->
  <div class="detail-view" id="view-sd">
    <div class="detail-header">
      <span class="back-btn" onclick="closeSD()">←</span>
      <div class="detail-title-wrap">
        <div class="detail-title" id="sd-title"></div>
        <div class="detail-capo" id="sd-date"></div>
      </div>
      <button type="button" class="event-notification-button" id="event-notification-button" onclick="openEventNotifications()" aria-label="Abrir alterações recentes" aria-haspopup="dialog">🔔</button>
    </div>
    <div class="detail-body" id="sd-content"></div>
  </div>
  <button type="button" class="event-chat-fab" id="event-chat-fab" onclick="openEventChat()" aria-label="Abrir chat do evento" hidden>💬</button>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModalOut(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <section class="event-chat-view" id="event-chat-view" aria-label="Chat do evento" hidden>
    <header class="event-chat-header">
      <button type="button" class="event-chat-back" onclick="closeEventChat()" aria-label="Voltar ao evento">←</button>
      <div><strong id="event-chat-title">Chat do evento</strong><span id="event-chat-subtitle"></span></div>
      <button type="button" class="event-chat-poll-open" onclick="openPollModal()" aria-label="Criar enquete">▥</button>
    </header>
    <div class="event-chat-messages" id="event-chat-messages"></div>
    <div class="event-chat-reply" id="event-chat-reply" hidden></div>
    <footer class="event-chat-composer">
      <button type="button" class="event-chat-emoji" onclick="insertChatEmoji()" aria-label="Adicionar emoji">☺</button>
      <textarea id="event-chat-input" rows="1" placeholder="Mensagem" onkeydown="handleChatKey(event)"></textarea>

<script>
// ── TRANSPOSIÇÃO ──────────────────────────────────────────────────────
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ALL_CHORDS = ['C#m','Dbm','D#m','Ebm','F#m','Gbm','G#m','Abm','A#m','Bbm',
                    'C#','Db','D#','Eb','F#','Gb','G#','Ab','A#','Bb',
                    'Cm','Dm','Em','Fm','Gm','Am','Bm','C','D','E','F','G','A','B'];

function noteIdx(n){let i=SHARP.indexOf(n);return i===-1?FLAT.indexOf(n):i;}
function shiftNote(n,s){
  const i=noteIdx(n); if(i===-1) return n;
  const ni=((i+s)%12+12)%12;
  return FLAT.includes(n)?FLAT[ni]:SHARP[ni];
}
function shiftToken(tok,s){
  for(const cn of ALL_CHORDS){
    if(tok.startsWith(cn)){
      const suf=tok.slice(cn.length);
      const isMinor=cn.length>1&&cn.endsWith('m');
      const root=isMinor?cn.slice(0,-1):cn;
      const newRoot=shiftNote(root,s);
      if(suf.startsWith('/')){return newRoot+(isMinor?'m':'')+'/'+shiftNote(suf.slice(1),s);}
      return newRoot+(isMinor?'m':'')+suf;
    }
  }
  return tok;
}
function shiftText(text,s){
  if(!s) return text;
  return text.split('\n').map(line=>
    line.replace(/[A-G][#b]?[a-z0-9#()\/]*/g,tok=>{
      for(const cn of ALL_CHORDS){if(tok.startsWith(cn)) return shiftToken(tok,s);}
      return tok;
    })
  ).join('\n');
}

  t.textContent=msg;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',1800);
}

function drawChordSVG(data, name, strings=6){
  const {f:frets,fi:fingers=[],b:baseFret=1,bar}=data;
  const maxFret=Math.max(...frets.filter(fret=>fret>0),baseFret);
  const S=strings,FRETS=Math.max(4,maxFret-baseFret+1);
  const SW=strings===4?15:12, FH=14;
  const PADL=strings>4?(baseFret>1?16:10):8, PADR=8;
  const NAME_H=0, MARK_H=14, NUT_H=3, GRID_H=FRETS*FH, PADB=8;
  const gridW=(S-1)*SW;
  const W=PADL+gridW+PADR, H=NAME_H+MARK_H+NUT_H+GRID_H+PADB;
  const gridX=PADL, gridY=NAME_H+MARK_H+NUT_H;
  let g='';
  g+=`<rect width="${W}" height="${H}" rx="8" fill="#1a1a2e"/>`;
  if(baseFret>1) g+=`<text x="${gridX-3}" y="${gridY+FH*0.7}" fill="#aaa" font-size="9" text-anchor="end" font-family="Arial">${baseFret}</text>`;
  if(baseFret===1) g+=`<rect x="${gridX}" y="${NAME_H+MARK_H}" width="${gridW}" height="${NUT_H}" fill="#e9edef" rx="1.5"/>`;
  for(let f=1;f<=FRETS;f++) g+=`<line x1="${gridX}" y1="${gridY+f*FH}" x2="${gridX+gridW}" y2="${gridY+f*FH}" stroke="#2a2a4a" stroke-width="1"/>`;
  for(let s=0;s<S;s++) g+=`<line x1="${gridX+s*SW}" y1="${gridY}" x2="${gridX+s*SW}" y2="${gridY+GRID_H}" stroke="#3a3a5a" stroke-width="1"/>`;
  if(bar){const by=gridY+(bar.fr-baseFret)*FH+FH/2,bx1=gridX+bar.s*SW,bx2=gridX+bar.e*SW;g+=`<rect x="${bx1}" y="${by-6}" width="${bx2-bx1}" height="12" rx="6" fill="#d97757" opacity="0.9"/>`;}
  const mY=NAME_H+MARK_H/2+2;
  frets.forEach((fr,si)=>{
    const x=gridX+si*SW;
    if(fr<0){
      g+=`<text x="${x}" y="${mY+4}" fill="#555" font-size="11" text-anchor="middle" font-family="Arial">×</text>`;
    } else if(fr===0){
      g+=`<circle cx="${x}" cy="${mY}" r="4" fill="none" stroke="#8a8a9a" stroke-width="1.5"/>`;
    } else {
      const fy=gridY+(fr-baseFret)*FH+FH/2;
      g+=`<circle cx="${x}" cy="${fy}" r="6.5" fill="#d97757"/>`;
      if(fingers[si]>0) g+=`<text x="${x}" y="${fy+3.5}" fill="#fff" font-size="8.5" text-anchor="middle" font-family="Arial" font-weight="bold">${fingers[si]}</text>`;
    }
  });
  return `<div class="chord-card"><div class="chord-card-name">${name}</div><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg></div>`;
}


function drawPianoSVG(noteString, name){
  const WKW=22, WKH=65, BKW=13, BKH=40;
  const totalW=7*WKW+2;
  const nm={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  const raw=(noteString||'').split(' - ').map(n=>n.trim());
  const notes=new Set(raw.map(n=>nm[n]||n));
  const whites=['C','D','E','F','G','A','B'];
  const blacks=[{n:'C#',p:0.67},{n:'D#',p:1.67},{n:'F#',p:3.67},{n:'G#',p:4.67},{n:'A#',p:5.67}];
  let g='';
  // white keys
  whites.forEach((note,i)=>{
    const on=notes.has(note);
    g+=`<rect x="${1+i*WKW}" y="0" width="${WKW-1.5}" height="${WKH}" rx="3" fill="${on?'#d97757':'#e9edef'}" stroke="#3a4042" stroke-width="1"/>`;
    g+=`<text x="${1+i*WKW+WKW/2}" y="${WKH-4}" fill="${on?'#fff':'#999'}" font-size="8" text-anchor="middle" font-family="Arial" font-weight="${on?'bold':'normal'}">${note}</text>`;
    if(on) g+=`<circle cx="${1+i*WKW+WKW/2}" cy="${WKH-16}" r="8" fill="rgba(0,0,0,0.2)"/>`;
  });
  // black keys
  blacks.forEach(({n,p})=>{
    const on=notes.has(n);
    const x=1+p*WKW-BKW/2;
    g+=`<rect x="${x}" y="0" width="${BKW}" height="${BKH}" rx="2" fill="${on?'#d97757':'#2a2a2a'}" stroke="${on?'#b05030':'#111'}" stroke-width="0.5"/>`;
    if(on) g+=`<text x="${x+BKW/2}" y="${BKH-4}" fill="#fff" font-size="7" text-anchor="middle" font-family="Arial" font-weight="bold">${n.replace('#','#')}</text>`;
  });
  return `<div class="chord-card" style="min-width:${totalW+22}px;">
    <div class="chord-card-name">${name}</div>
    <svg width="${totalW}" height="${WKH+2}" viewBox="0 0 ${totalW} ${WKH+2}" xmlns="http://www.w3.org/2000/svg">${g}</svg>
    <div style="color:#8696a0;font-size:10px;margin-top:3px;font-family:Arial;">${raw.join(' · ')}</div>
  </div>`;
}

function drawValidatedFrettedSVG(data,name){
  const frets=data.frets, fingers=data.fingers||[], courses=data.courses;
  const baseFret=data.baseFret||1, shownFrets=5, spacing=courses>=6?18:22, fretHeight=20;
  const padLeft=baseFret>1?24:15, padRight=15, markerHeight=22;
  const gridWidth=(courses-1)*spacing, gridTop=markerHeight+5, gridHeight=shownFrets*fretHeight;
  const width=padLeft+gridWidth+padRight, height=gridTop+gridHeight+26;
  let svg=`<rect width="${width}" height="${height}" rx="10" fill="#050b14"/>`;
  if(baseFret===1) svg+=`<rect x="${padLeft}" y="${gridTop-3}" width="${gridWidth}" height="4" rx="2" fill="#f8fafc"/>`;
  else svg+=`<text x="${padLeft-5}" y="${gridTop+14}" fill="#cbd5e1" font-size="11" text-anchor="end" font-family="Inter,Arial">${baseFret}ª</text>`;
  for(let fret=0;fret<=shownFrets;fret++) svg+=`<line x1="${padLeft}" y1="${gridTop+fret*fretHeight}" x2="${padLeft+gridWidth}" y2="${gridTop+fret*fretHeight}" stroke="#94a3b8" stroke-width="1.6"/>`;
  for(let course=0;course<courses;course++) svg+=`<line x1="${padLeft+course*spacing}" y1="${gridTop}" x2="${padLeft+course*spacing}" y2="${gridTop+gridHeight}" stroke="#cbd5e1" stroke-width="1.7"/>`;
  for(const barre of data.barres||[]){
    const y=gridTop+(barre.fret-baseFret)*fretHeight+fretHeight/2;
    const x1=padLeft+barre.start*spacing, x2=padLeft+barre.end*spacing;
    svg+=`<rect x="${x1-7}" y="${y-8}" width="${x2-x1+14}" height="16" rx="8" fill="var(--music-accent)"/>`;
    svg+=`<text x="${(x1+x2)/2}" y="${y+4}" fill="#fff" font-size="11" text-anchor="middle" font-family="Inter,Arial" font-weight="800">${barre.finger}</text>`;
  }
  frets.forEach((fret,index)=>{
    const x=padLeft+index*spacing;
    if(fret<0) svg+=`<text x="${x}" y="17" fill="#fff" font-size="16" text-anchor="middle" font-family="Inter,Arial">×</text>`;
    else if(fret===0) svg+=`<circle cx="${x}" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2"/>`;
    else {
      const y=gridTop+(fret-baseFret)*fretHeight+fretHeight/2;
      const coveredByBarre=(data.barres||[]).some(barre=>barre.finger===fingers[index]&&barre.fret===fret&&index>=barre.start&&index<=barre.end);
      if(coveredByBarre) return;
      svg+=`<circle cx="${x}" cy="${y}" r="8" fill="var(--music-accent)"/>`;
      if(fingers[index]) svg+=`<text x="${x}" y="${y+4}" fill="#fff" font-size="11" text-anchor="middle" font-family="Inter,Arial" font-weight="800">${fingers[index]}</text>`;
    }
  });
  const courseLabel=data.renderer==='double-course-fretted'?'5 ordens duplas':`${courses} cordas`;
  return `<div class="chord-card" data-instrument="${data.instrumentId}" data-renderer="${data.renderer}" data-courses="${courses}"><div class="chord-card-name">${name}</div><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-label="Diagrama ${name} para ${data.instrumentId}">${svg}</svg><div class="chord-tuning">${courseLabel} · ${data.tuning}</div></div>`;
}

function drawValidatedKeyboardSVG(data,name){
  const whiteNotes=['C','D','E','F','G','A','B'];
  const blackNotes=[{note:'C#',left:26},{note:'D#',left:62},{note:'F#',left:134},{note:'G#',left:170},{note:'A#',left:206}];
  const active=new Set(data.notes), root=data.root, bass=data.bass;
  const keyColor=(note)=>note===bass&&bass!==root?'#22C55E':note===root?'var(--music-accent)':'#F2A48B';
  let svg='<rect width="252" height="116" rx="10" fill="#050b14"/>';
  whiteNotes.forEach((note,index)=>{
    const on=active.has(note), x=4+index*35;
    svg+=`<rect x="${x}" y="5" width="34" height="96" rx="3" fill="${on?keyColor(note):'#f8fafc'}" stroke="#334155" stroke-width="1.5"/>`;
    svg+=`<text x="${x+17}" y="94" fill="${on?'#fff':'#475569'}" font-size="11" text-anchor="middle" font-family="Inter,Arial" font-weight="700">${note}</text>`;
  });
  blackNotes.forEach(({note,left})=>{
    const on=active.has(note);
    svg+=`<rect x="${left}" y="5" width="22" height="61" rx="3" fill="${on?keyColor(note):'#111827'}" stroke="#020617" stroke-width="1.5"/>`;
    if(on) svg+=`<text x="${left+11}" y="57" fill="#fff" font-size="9" text-anchor="middle" font-family="Inter,Arial" font-weight="800">${note}</text>`;
  });
  return `<div class="chord-card keyboard-card" data-instrument="${data.instrumentId}" data-renderer="keyboard"><div class="chord-card-name">${name}</div><svg width="252" height="116" viewBox="0 0 252 116" aria-label="Teclas do acorde ${name}">${svg}</svg><div class="chord-tuning">${data.notes.join(' · ')}${bass!==root?` · baixo ${bass}`:''}</div></div>`;
}

function extractChords(m){
  const summary=songFormat.harmonicSummary(m),seen=new Set(),result=[];
  summary.sections.forEach(section=>section.lines.forEach(line=>line.chords.forEach(item=>{
    const chord=chordUtils.normalizeChordName(item.chord);
    if(chord&&!seen.has(chord)){seen.add(chord);result.push(chord);}
  })));
  return result;
}

function renderChordStrip(m){
  const el=document.getElementById('chord-strip');
  if(!el) return;
  const totalShift=currentSemitones+storedCapo-selectedCapo;
  const rawChords=extractChords(m);
  const chords=[...new Set(rawChords.map(c=>shiftText(c,totalShift)))];
  if(!chords.length){el.innerHTML='';return;}
  const html=chords.map(name=>{
    const data=getChordData(name);
    if(!data) return renderUnavailableChord(name);
    return data.renderer==='keyboard'?drawValidatedKeyboardSVG(data,name):drawValidatedFrettedSVG(data,name);
  }).join('');
  el.innerHTML=`<div class="chord-strip-wrap">${html}</div>`;
}

// detecta se uma linha é de acordes ou letra
function isChordLine(linha){
  const t = linha.trim();
  if(!t) return false;
  // remove pontos, vírgulas, x, parênteses, colchetes, números soltos — deixa só acordes e espaços
  const limpa = t.replace(/[.,\(\)\[\]x0-9]/gi,'').trim();
  // divide em tokens e verifica se todos são acordes reconhecíveis
  const tokens = limpa.split(/\s+/).filter(Boolean);
  if(!tokens.length) return false;
  const chordPattern = /^[A-G][#b]?(m|M|maj|min|dim|aug|sus)?[0-9]?(\/[A-G][#b]?)?$/;
  const todosAcordes = tokens.every(tok => chordPattern.test(tok));
  // se pelo menos 60% dos tokens parecem acordes = linha de acorde
  const acordes = tokens.filter(tok => chordPattern.test(tok));
  return acordes.length > 0 && (acordes.length / tokens.length) >= 0.6;
}

function bold(txt){
  return (txt||'').replace(/\*(.*?)\*/g,'<strong style="font-family:Arial,sans-serif;color:#ffffff;font-size:18px;font-weight:700;">$1</strong>');
}

function renderLinha(linha, totalShift){
  const t = linha.trim();
  if(!t) return '';
  // se tem asterisco, é letra explícita
  if(t.startsWith('*') && t.endsWith('*')){
    return `<div class="letra-linha">${t.replace(/\*/g,'')}</div>`;
  }
  // detecta automaticamente
  if(isChordLine(t)){
    // remove pontos dos acordes antes de exibir e transpor
    const semPontos = t.replace(/\./g,' ').replace(/\s+/g,' ').trim();
    return `<div class="chord-line">${shiftText(semPontos, totalShift)}</div>`;
  }
  // tudo que não é acorde = letra em negrito automático
  return `<div class="letra-linha">${t}</div>`;
}

function renderFullChordSheet(sheet,totalShift){
  if(!sheet?.content) return '';
  if(Array.isArray(sheet.sections)&&sheet.sections.some(section=>Array.isArray(section.linhas)&&section.linhas.length)){
    const structured=sheet.sections.map(section=>{
      const heading=section.nome?`<div class="full-chord-line is-section">${eventEsc(section.nome)}</div>`:'';
      const lines=(section.linhas||[]).map(line=>{
        const ordered=[...(line.acordes||[])].sort((a,b)=>a.posicao-b.posicao);
        let chordLine='';
        ordered.forEach(item=>{
          const chord=shiftText(item.acorde,totalShift);
          const position=Math.max(chordLine.length,Number(item.posicao)||0);
          chordLine+=' '.repeat(position-chordLine.length)+chord;
        });
        const chords=chordLine?`<div class="full-chord-line is-chord">${eventEsc(chordLine)}</div>`:'';
        const lyric=line.letra?`<div class="full-chord-line">${eventEsc(line.letra)}</div>`:'';
        return chords+lyric;
      }).join('');
      return heading+lines;
    }).join('');
    return `<div class="full-chord-private">Privada · conteúdo fornecido por você</div><article class="full-chord-sheet">${structured}</article>`;
  }
  const rows=sheet.content.replace(/\r\n?/g,'\n').split('\n').map(raw=>{
    const text=raw.trimEnd();
    if(!text) return '<div class="full-chord-line">&nbsp;</div>';
    if(isChordLine(text)) return `<div class="full-chord-line is-chord">${eventEsc(shiftText(text,totalShift))}</div>`;
    const section=/^\s*(?:\[.*\]|intro|introdução|verso(?:\s+\d+)?|pré-refrão|refrão|ponte|solo|interlúdio|final|outro)\s*:?\s*$/i.test(text);
    return `<div class="full-chord-line${section?' is-section':''}">${eventEsc(text)}</div>`;
  }).join('');
  return `<div class="full-chord-private">Privada · conteúdo fornecido por você</div><article class="full-chord-sheet">${rows}</article>`;
}

function renderStageStructure(summary,totalShift){
  const sections=(summary&&summary.sections)||[];
  if(!sections.length)return '<div class="empty-state"><div class="emoji">🎼</div><p>Estrutura ainda não cadastrada</p></div>';
  return `<section class="stage-structure-view" aria-label="Estrutura da música">${sections.map((section,index)=>{
    const progression=section.lines.map(line=>songFormat.renderChordLine(line.chords||[])).filter(Boolean).join(' · ');
    return `<article class="stage-structure-card"><strong>${eventEsc(section.label||`Parte ${index+1}`)}</strong><span>${eventEsc(shiftText(progression,totalShift)||'—')}</span></article>`;
  }).join('')}</section>`;
}

function renderDetail(){
  const m=currentDetailSongOverride||musicas.find(x=>x.id===currentDetailId); if(!m) return;
  const summary=songFormat.harmonicSummary(m);
  // tom que SONA = tom original + transpose
  const soundingKey=shiftText(summary.currentKey, currentSemitones);
  // tom das formas tocadas = sounding - capo selecionado
  const shapeKey=shiftText(soundingKey, -selectedCapo);
  // display do badge igual Cifra Club: "Tom: A (forma de G)"
  if(selectedCapo>0){
    document.getElementById('detail-key').textContent=`${soundingKey} (forma de ${shapeKey})`;
  } else {
    document.getElementById('detail-key').textContent='Tom: '+soundingKey;
  }
  document.getElementById('transposed-key').textContent=soundingKey;
  const sl=document.getElementById('semitone-label');
  sl.textContent=(currentSemitones>=0?'+':'')+currentSemitones;
  sl.style.color=currentSemitones===0?'var(--text2)':currentSemitones>0?'var(--accent)':'#e2954b';
  // shapes exibidos: storedCapo - selectedCapo + transpose
  const totalShift=currentSemitones+storedCapo-selectedCapo;
  const hasFull=Boolean(m.fullChordSheet?.content);
  if(!hasFull) currentSongView='summary';
  if(stageMode&&hasFull&&activeStagePreferences?.contentMode!=='structure')currentSongView='full';
  const switchHtml=hasFull?`<div class="song-view-switch" role="tablist" aria-label="Visualização da música"><button type="button" role="tab" aria-selected="${currentSongView==='full'}" class="${currentSongView==='full'?'active':''}" onclick="setSongView('full')">Letra + Cifras</button><button type="button" role="tab" aria-selected="${currentSongView==='summary'}" class="${currentSongView==='summary'?'active':''}" onclick="setSongView('summary')">Resumo Harmônico</button></div>`:'';
  const blocosHtml = summary.sections.map(section=>{
    const corpo=section.lines.map(line=>{
      const chords=line.chords.length?songFormat.renderChordLine(line.chords):'';
      const repeat=line.repeticoes?` (${line.repeticoes}x)`:'';
      const chordHtml=chords?`<div class="chord-line">${eventEsc(shiftText(chords,totalShift))}${repeat}</div>`:'';
      const lyricText=line.lyrics.startsWith('*')&&line.lyrics.endsWith('*')?line.lyrics.slice(1,-1):line.lyrics;
      const lyricHtml=lyricText?`<div class="letra-linha">${eventEsc(lyricText)}</div>`:'';
      return chordHtml+lyricHtml;
    }).join('');
    const labelHtml=section.showLabel&&section.label?`<div class="letra-linha">${eventEsc(section.label)}</div>`:'';
    return `<div class="wa-block">${corpo}${labelHtml}</div>`;
  }).join('');
  const chordSheetHtml=stageMode&&activeStagePreferences?.contentMode==='structure'
    ?renderStageStructure(summary,totalShift)
    :currentSongView==='full'?renderFullChordSheet(m.fullChordSheet,totalShift):(blocosHtml||`<div class="empty-state"><div class="emoji">🎼</div><p>Cifra ainda não cadastrada</p><button class="btn btn-primary" style="margin-top:14px;" onclick="editMusica('${m.id}')">Adicionar cifra</button></div>`);
  document.getElementById('detail-content').innerHTML = switchHtml+chordSheetHtml +
    `<button class="ai-generate-action" style="width:calc(100% - 24px);margin:12px" onclick="generateAiForSong('${m.id}')">Gerar resumo com IA</button>`+
    `<div class="btn-row">
      <button class="btn btn-outline" onclick="editMusica('${m.id}')">Editar cifra</button>
      <button class="btn btn-danger" onclick="deleteMusica('${m.id}')">🗑️ Excluir</button>
    </div>`;
  if(stageMode)updateStagePresentation();
}

let medleyBlocos=[];

function renderMedley(){
  const el=document.getElementById('medley-content');
  if(!medleyBlocos.length){
    el.innerHTML=`<div class="empty-state"><div class="emoji">🎛️</div><p>Nenhum bloco no medley</p><p style="font-size:12px;margin-top:6px;">Adicione partes de músicas abaixo</p></div>

    return;
  }
  el.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <span style="font-size:14px;font-weight:700;">${medleyBlocos.length} bloco(s)</span>
      <button class="btn btn-primary" style="width:auto;padding:6px 14px;margin:0;font-size:13px;" onclick="tocarMedley()">▶ Tocar Medley</button>
    </div>`+
    medleyBlocos.map((b,i)=>`
    <div class="medley-block">
      <div class="medley-block-header">
        <span class="medley-source">🎵 ${b.musicTitle} — ${b.label||'Bloco'}</span>
        <div class="medley-order-btns">
          ${i>0?`<button class="medley-order-btn" onclick="moveMedley(${i},-1)">↑</button>`:''}
          ${i<medleyBlocos.length-1?`<button class="medley-order-btn" onclick="moveMedley(${i},1)">↓</button>`:''}
        </div>
        <button class="medley-remove" onclick="removeMedley(${i})">✕</button>
      </div>
      <div class="chord-line" style="font-size:16px;">${b.chords.replace(/\n/g,'<br>')}</div>
    </div>`).join('')+
    `<button class="btn btn-outline" style="margin-top:8px;" onclick="abrirAddMedley()">+ Adicionar bloco</button>
     <button class="btn btn-danger" style="margin-top:6px;" onclick="limparMedley()">🗑️ Limpar tudo</button>`;
}

function abrirAddMedley(){
  const sorted=[...musicas].sort((a,b)=>a.title.localeCompare(b.title,'pt'));
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">Adicionar ao Medley</div>
    <div class="form-group">
      <label class="form-label">Música</label>
      <select class="form-input" id="med-music" onchange="renderMedleyBlocoSelect()">
        ${sorted.map(m=>`<option value="${m.id}">${m.title} (${m.key||'?'})</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Parte</label>
      <select class="form-input" id="med-bloco"></select>
    </div>
    <button class="btn btn-primary" onclick="confirmarAddMedley()">Adicionar</button>
    <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>`;
  renderMedleyBlocoSelect();
  document.getElementById('modal-overlay').style.display='flex';

function renderMedleyBlocoSelect(){
  const mid=parseInt(document.getElementById('med-music').value);
  const m=musicas.find(x=>x.id===mid);
  const sel=document.getElementById('med-bloco');
  if(!m||!sel) return;
  sel.innerHTML=m.blocos.map((b,i)=>`<option value="${i}">${b.l||'Bloco '+(i+1)} — ${b.c.split('\n')[0].substring(0,30)}</option>`).join('');
}

function confirmarAddMedley(){
  const mid=parseInt(document.getElementById('med-music').value);
  const bi=parseInt(document.getElementById('med-bloco').value);
  const m=musicas.find(x=>x.id===mid);
  if(!m) return;
  const b=m.blocos[bi];
  medleyBlocos.push({musicTitle:m.title,musicId:mid,blocoIdx:bi,label:b.l||'Bloco '+(bi+1),chords:b.c,key:m.key});
  closeModal(); renderMedley();
}

function moveMedley(i,dir){
  const ni=i+dir;
  if(ni<0||ni>=medleyBlocos.length) return;
  [medleyBlocos[i],medleyBlocos[ni]]=[medleyBlocos[ni],medleyBlocos[i]];
  renderMedley();
}

function removeMedley(i){medleyBlocos.splice(i,1);renderMedley();}
function limparMedley(){if(confirm('Limpar o medley?')){medleyBlocos=[];renderMedley();}}

function tocarMedley(){
  // abre view de medley em modo palco
  currentDetailId=null;
  const vd=document.getElementById('view-detail');
  document.getElementById('detail-title').textContent='🎛️ Medley';
  document.getElementById('detail-key').textContent='';
  document.getElementById('transposed-key').textContent='';
  document.getElementById('semitone-label').textContent='+0';
  document.querySelectorAll('.stage-hide').forEach(el=>el.style.display='');
  document.getElementById('detail-content').innerHTML=
    medleyBlocos.map((b,i)=>`
    <details class="chord-block" ${i===0?'open':''}>

function parseBlocks(raw){
  const lines=raw.trim().split('\n');
  const blocks=[]; let cur=null;
  lines.forEach(l=>{
    const lt=l.trim();
    if(!lt){ // linha vazia = nova estrofe
      if(cur && cur.c.trim()) { blocks.push(cur); cur=null; }
      return;
    }
    // [Bloco] ou *Bloco* = label
    if((lt.startsWith('[')&&lt.endsWith(']'))||(lt.startsWith('*')&&lt.endsWith('*')&&!lt.slice(1,-1).includes('*'))){
      if(cur && cur.c.trim()) blocks.push(cur);
      const label = lt.startsWith('[') ? lt.slice(1,-1) : lt;
      cur={l:label, c:''};
    } else {
      if(!cur) cur={l:'',c:''};
      cur.c+=(cur.c?'\n':'')+lt;
    }
  });
  if(cur && cur.c.trim()) blocks.push(cur);
  return blocks.length?blocks:[{l:'',c:raw}];
}

async function syncEventsNow(silent){
  const button=document.getElementById('event-sync-action'),status=document.getElementById('event-sync-status');
  if(button)button.disabled=true;if(status)status.textContent='Postando alterações…';
  try{
    await eventCollaboration.ensureRegistered(appCurrentUser);
    for(const localEvent of [...setlists]){
      if(localEvent.syncState!=='pending'||!localEvent.pendingShared||!eventModel.isLeader(localEvent,appCurrentUser.id))continue;
      const synced=await eventCollaboration.saveSharedEvent(localEvent,appCurrentUser);setlists=eventRepository.upsert(setlists,synced).events;
    }
    for(const synced of await eventCollaboration.flushPersonalQueue(appCurrentUser))setlists=eventRepository.upsert(setlists,synced).events;
    const remote=await eventCollaboration.listEvents(appCurrentUser);
    setlists=eventRepository.mergeRemote(setlists,remote);eventRepository.save(setlists);renderSetlists();
    await refreshBands(true);
    if(status)status.textContent='Compartilhamento concluído';if(!silent)showToast('✅ Alterações compartilhadas');
  }catch(error){if(status)status.textContent='Modo offline — dados preservados neste dispositivo';if(!silent)showToast('⚠️ '+(error.message||'Sincronização indisponível'));}
  finally{if(button)button.disabled=false;}
}

const EVENT_NOTICE_READ_KEY='sc_event_notice_read_v1';
function eventNoticeReadIds(eventId){
  const state=storage.get(EVENT_NOTICE_READ_KEY,{}),userState=state&&state[String(appCurrentUser.id)]||{};
  return new Set(Array.isArray(userState[String(eventId)])?userState[String(eventId)]:[]);
}
function eventUnreadNotices(event){const read=eventNoticeReadIds(event.id);return event.notifications.filter(notice=>!read.has(String(notice.id)));}
function markEventNoticesRead(event){
  const state=storage.get(EVENT_NOTICE_READ_KEY,{}),userId=String(appCurrentUser.id),userState={...(state&&state[userId]||{})};
  userState[String(event.id)]=event.notifications.map(notice=>String(notice.id)).slice(-50);
  storage.set(EVENT_NOTICE_READ_KEY,{...(state||{}),[userId]:userState});
}

  try{
    if(scope==='shared')event=event.remoteVersion==null?await eventCollaboration.saveSharedEvent(event,appCurrentUser):await eventCollaboration.saveSharedItem(event,itemId,changes,appCurrentUser);
    else if(event.remoteVersion!=null)event=await eventCollaboration.savePersonalItem(event,itemId,changes,appCurrentUser);
    else eventCollaboration.queuePersonalOperation(event.id,itemId,'upsert',changes);
  }catch(error){if(!collaborationAllowsOffline(error)){showToast('⚠️ '+error.message);return;}if(scope==='personal')eventCollaboration.queuePersonalOperation(event.id,itemId,'upsert',changes);}
  setlists=eventRepository.upsert(setlists,event).events;eventRepository.save(setlists);
  if(scope==='shared'){try{eventChat.sendSystem(event.id,(appCurrentUser.name||'Você')+' alterou uma música do repertório oficial.');}catch(error){}}
  closeModal();openSD(event.id);showToast(scope==='shared'?'🔔 Alteração oficial compartilhada':'👤 Alteração pessoal salva');
}
async function clearEventPersonalEdit(eventId,itemId){let event=findEvent(eventId);if(!event)return;try{event=eventModel.create({...eventModel.clearPersonalEdit(event,itemId,appCurrentUser.id),syncState:'pending'});if(event.remoteVersion!=null)event=await eventCollaboration.clearPersonalItem(event,itemId,appCurrentUser);else eventCollaboration.queuePersonalOperation(event.id,itemId,'delete');}catch(error){if(!collaborationAllowsOffline(error)){showToast('⚠️ '+error.message);return;}eventCollaboration.queuePersonalOperation(event.id,itemId,'delete');}setlists=eventRepository.upsert(setlists,event).events;eventRepository.save(setlists);closeModal();openSD(event.id);showToast('🌐 Versão oficial restaurada');}

function sharePlaylist(id){const event=findEvent(id);if(!event)return;const songs=event.musicas.map(songId=>musicas.find(song=>String(song.id)===String(songId))).filter(Boolean);const text='📅 '+event.title+'\n'+[eventDisplayDate(event.date),event.time,event.location].filter(Boolean).join(' · ')+'\n\n'+songs.map((song,index)=>(index+1)+'. '+song.title+(song.key?' | Tom: '+song.key:'')).join('\n')+'\n\n👥 '+event.members.map(member=>member.name+' — '+member.role).join(', ');if(navigator.share)navigator.share({title:event.title,text}).catch(()=>{});else prompt('Copie e compartilhe:',text);}
async function deleteSetlist(id){const event=findEvent(id);if(!event||!confirm('Excluir este evento?'))return;try{eventModel.requireLeader(event,appCurrentUser.id);if(event.remoteVersion!=null)await eventCollaboration.deleteEvent(event,appCurrentUser);setlists=eventRepository.removeShared(setlists,id,appCurrentUser);}catch(error){if(!collaborationAllowsOffline(error)){showToast('🔒 '+error.message);return;}setlists=eventRepository.removeShared(setlists,id,appCurrentUser);}eventRepository.save(setlists);closeSD();showToast('Evento excluído');}

function openEventChat(){const event=findEvent(currentSdId);if(!event)return;try{eventChat.markRead(event.id);}catch(error){showToast(error.message);return;}chatReplyTo=null;chatLimit=40;document.getElementById('event-chat-title').textContent=event.title;document.getElementById('event-chat-subtitle').textContent=event.members.length+' participante(s)';document.getElementById('event-chat-view').hidden=false;renderEventChatMessages(true);}
function closeEventChat(){document.getElementById('event-chat-view').hidden=true;chatReplyTo=null;if(currentSdId)openSD(currentSdId);}
function eventChatButton(label,handler,className){const button=document.createElement('button');button.type='button';button.textContent=label;button.className=className||'';button.addEventListener('click',handler);return button;}
function renderEventChatMessages(scrollEnd){
  const event=findEvent(currentSdId),target=document.getElementById('event-chat-messages');if(!event||!target||document.getElementById('event-chat-view').hidden)return;
  let all=[];try{all=eventChat.list(event.id,10000);}catch(error){target.textContent=error.message;return;}target.textContent='';
  if(all.length>chatLimit)target.appendChild(eventChatButton('Carregar mensagens anteriores',()=>{chatLimit+=40;renderEventChatMessages(false);},'event-chat-load'));
  const visible=all.slice(-chatLimit),byId=new Map(all.map(message=>[String(message.id),message]));
  visible.forEach(message=>{
    const mine=String(message.sender.id)===String(appCurrentUser.id);const row=document.createElement('article');row.className='event-message '+(mine?'mine ':'')+(message.type==='system'?'system':'');
    if(message.type!=='system'){const avatar=document.createElement('div');avatar.className='event-message-avatar';if(message.sender.avatarUrl){const image=document.createElement('img');image.src=message.sender.avatarUrl;image.alt='';avatar.appendChild(image);}else avatar.textContent=eventInitials(message.sender.name);row.appendChild(avatar);}
    const bubble=document.createElement('div');bubble.className='event-message-bubble';
    if(message.type==='system'){const content=document.createElement('div');content.className='event-message-content';content.textContent=message.content;bubble.appendChild(content);}
    else{
      if(!mine){const author=document.createElement('span');author.className='event-message-author';author.textContent=message.sender.name;bubble.appendChild(author);}
      if(message.replyTo&&byId.has(String(message.replyTo))){const quote=document.createElement('div');quote.className='event-message-reply-quote';const original=byId.get(String(message.replyTo));quote.textContent=(original.sender.name||'')+': '+(original.content||original.poll&&original.poll.question||'Mensagem');bubble.appendChild(quote);}
      if(message.type==='poll')renderPollMessage(bubble,event.id,message);
      else{const content=document.createElement('div');content.className='event-message-content';content.textContent=message.deleted?'Mensagem excluída':message.content+(message.editedAt?' (editada)':'');bubble.appendChild(content);}
      if(!message.deleted){const reactions=document.createElement('div');reactions.className='event-message-actions';['👍','❤️','🙏'].forEach(emoji=>{const count=(message.reactions&&message.reactions[emoji]||[]).length;if(count){const chip=eventChatButton(emoji+' '+count,()=>eventChat.react(event.id,message.id,emoji),'event-reaction');if((message.reactions[emoji]||[]).includes(appCurrentUser.id))chip.classList.add('active');reactions.appendChild(chip);}});bubble.appendChild(reactions);
        const actions=document.createElement('div');actions.className='event-message-actions';actions.append(eventChatButton('Responder',()=>replyEventMessage(message.id)),eventChatButton('👍',()=>eventChat.react(event.id,message.id,'👍')),eventChatButton('Copiar',()=>copyChatMessage(message)));if(mine&&message.type==='text'){actions.append(eventChatButton('Editar',()=>editChatMessage(message)),eventChatButton('Excluir',()=>deleteChatMessage(message)));}bubble.appendChild(actions);}
    }
    const time=document.createElement('span');time.className='event-message-time';time.textContent=new Date(message.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});bubble.appendChild(time);row.appendChild(bubble);target.appendChild(row);
  });
  eventChat.markRead(event.id);if(scrollEnd)requestAnimationFrame(()=>{target.scrollTop=target.scrollHeight;});
}
function renderPollMessage(bubble,eventId,message){const title=document.createElement('div');title.className='event-poll-question';title.textContent='📊 '+message.poll.question;bubble.appendChild(title);const uniqueVoters=new Set(Object.values(message.poll.votes||{}).flat());message.poll.options.forEach(option=>{const voters=message.poll.votes[option.id]||[],percent=uniqueVoters.size?Math.round(voters.length/uniqueVoters.size*100):0;const item=document.createElement('div');item.className='event-poll-option'+(voters.includes(appCurrentUser.id)?' selected':'');item.addEventListener('click',()=>eventChat.vote(eventId,message.id,option.id));const fill=document.createElement('span');fill.className='event-poll-option-fill';fill.style.width=percent+'%';const content=document.createElement('span');content.className='event-poll-option-content';const votersText=message.poll.showVoters&&voters.length?' · '+voters.map(id=>{const member=findEvent(eventId).members.find(value=>String(value.id)===String(id));return member?member.name:(String(id)===String(appCurrentUser.id)?appCurrentUser.name:'Membro');}).join(', '):'';content.innerHTML='<span>'+eventEsc(option.label)+eventEsc(votersText)+'</span><strong>'+voters.length+' · '+percent+'%</strong>';item.append(fill,content);bubble.appendChild(item);});const total=document.createElement('span');total.className='event-poll-total';total.textContent=uniqueVoters.size+' participante(s) votaram';bubble.appendChild(total);}
function sendEventMessage(){const input=document.getElementById('event-chat-input'),event=findEvent(currentSdId);if(!event)return;try{eventChat.sendText(event.id,input.value,chatReplyTo);input.value='';cancelChatReply();renderEventChatMessages(true);}catch(error){showToast(error.message);}}
function handleChatKey(event){if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendEventMessage();}}
function insertChatEmoji(){const input=document.getElementById('event-chat-input');input.value+=' 🙏';input.focus();}
function replyEventMessage(messageId){chatReplyTo=messageId;const message=eventChat.list(currentSdId,10000).find(value=>String(value.id)===String(messageId)),preview=document.getElementById('event-chat-reply');preview.hidden=false;preview.innerHTML='<button type="button" onclick="cancelChatReply()">×</button>Respondendo a <strong>'+eventEsc(message&&message.sender.name||'mensagem')+'</strong>: '+eventEsc(message&&message.content||message&&message.poll&&message.poll.question||'');document.getElementById('event-chat-input').focus();}
function cancelChatReply(){chatReplyTo=null;const preview=document.getElementById('event-chat-reply');preview.hidden=true;preview.textContent='';}
function editChatMessage(message){const content=prompt('Editar mensagem:',message.content);if(content!=null){eventChat.edit(currentSdId,message.id,content);renderEventChatMessages(false);}}
function deleteChatMessage(message){if(confirm('Excluir sua mensagem?')){eventChat.remove(currentSdId,message.id);renderEventChatMessages(false);}}
function copyChatMessage(message){navigator.clipboard&&navigator.clipboard.writeText(message.content||message.poll&&message.poll.question||'').then(()=>showToast('Mensagem copiada')).catch(()=>{});}
function openPollModal(){document.getElementById('modal-body').innerHTML='<div class="modal-title">Nova enquete</div><div class="form-group"><label class="form-label">Pergunta</label><input class="form-input" id="poll-question" placeholder="Qual música devemos usar?"></div><div class="form-group"><label class="form-label">Opções — uma por linha</label><textarea class="form-textarea" id="poll-options" placeholder="Música A\nMúsica B\nMúsica C"></textarea></div><label class="chip"><input type="checkbox" id="poll-multiple"> Permitir múltiplas escolhas</label><label class="chip selected"><input type="checkbox" id="poll-voters" checked> Mostrar quem votou</label><button class="btn btn-primary" onclick="submitEventPoll()">Publicar enquete</button><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>';document.getElementById('modal-overlay').style.display='flex';}
function submitEventPoll(){try{eventChat.createPoll(currentSdId,{question:document.getElementById('poll-question').value,options:document.getElementById('poll-options').value.split(/\n/),multiple:document.getElementById('poll-multiple').checked,showVoters:document.getElementById('poll-voters').checked});closeModal();renderEventChatMessages(true);}catch(error){showToast(error.message);}}

function closeModalOut(e){if(e.target===document.getElementById('modal-overlay')) closeModal();}
function closeModal(){if(currentLocationAutocomplete){currentLocationAutocomplete.destroy();currentLocationAutocomplete=null;}document.getElementById('modal-overlay').style.display='none';editingId=null;simpleReviewDraft=null;eventSongEditDraft=null;}

  const result=libraryExporter.export({

    configuracoes:{
      instrumento:currentInstrument,
      velocidadeAutoScroll:scrollSpeed,
      tamanhoFontePalco:stageFontSizes[stageFontIndex]
    }

    :`${result.standardCount} música(s) do catálogo padrão exportadas. Nenhuma biblioteca salva foi encontrada.`;
